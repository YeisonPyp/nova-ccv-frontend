<div class="flex flex-col gap-2">
  @if (title()) {
    <p
      class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest"
    >
      {{ title() }}
    </p>
  }
  <div [style.height.px]="height()">
    <canvas baseChart [data]="data()" [options]="options" type="bar"></canvas>
  </div>
</div>
