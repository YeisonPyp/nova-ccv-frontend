<div
  class="flex items-center justify-between gap-3 py-2 border-b border-gray-100 last:border-b-0"
  [formGroup]="formGroup"
>
  <div class="flex flex-col gap-0.5 min-w-0">
    <span class="text-xs text-gray-600 truncate">{{ label() }}</span>
    @if (targetValue() != null) {
      <span class="text-[10px] text-gray-400">
        {{ targetLabel() }}: {{ targetValue() | number }}
      </span>
    }
    @if (referenceValue() != null) {
      <span class="text-[10px] text-gray-400">
        {{ referenceLabel() }}: {{ referenceValue() | number }}
      </span>
    }
  </div>

  <div class="relative w-32 shrink-0">
    @if (currency()) {
      <input
        type="text"
        class="form-control pl-7 w-full sm:text-sm text-right"
        appCurrencyFormat
        [appFormFieldError]="{}"
        formControlName="amount"
        min="0"
        placeholder="0.00"
      />
    } @else {
      <input
        type="number"
        class="form-control w-full sm:text-sm text-right"
        [appFormFieldError]="{}"
        formControlName="amount"
        min="0"
        step="0.01"
        placeholder="0"
      />
    }
  </div>
</div>
