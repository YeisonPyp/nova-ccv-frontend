<div
  class="fixed bottom-4 right-4 z-1100 flex flex-col gap-3 w-80 max-w-[calc(100vw-2rem)]"
  aria-live="polite"
>
  @for (n of notifications(); track n.id) {
    <div
      class="relative flex items-start gap-3 rounded-lg bg-white shadow-lg border border-gray-100 overflow-hidden animate-[slideIn_0.2s_ease-out]"
    >
      <span
        class="w-1 self-stretch shrink-0"
        [class]="styles(n.type).bar"
      ></span>
      <div class="flex-1 min-w-0 py-3 pr-2">
        @if (n.title) {
          <p class="text-sm font-semibold text-gray-900">{{ n.title }}</p>
        }
        <p class="text-sm text-gray-600 wrap-break-word">{{ n.message }}</p>
      </div>
      <button
        type="button"
        class="p-2 text-gray-400 hover:text-gray-600 shrink-0"
        (click)="dismiss(n.id)"
        aria-label="Cerrar"
      >
        <svg
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  }
</div>
