@if (title()) {
  <p
    class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest mb-2"
  >
    {{ title() }}
  </p>
}
<div class="grid grid-cols-4 sm:grid-cols-6 gap-3">
  @for (m of monthLabels; track m; let i = $index) {
    <div class="flex flex-col gap-1">
      <label class="text-[0.65rem] text-gray-400 uppercase">{{ m }}</label>
      <input
        type="number"
        step="0.01"
        class="form-control text-sm"
        [disabled]="disabled()"
        [value]="valueFor(i + 1)"
        (blur)="onBlur(i + 1, $any($event.target).value)"
      />
    </div>
  }
</div>
