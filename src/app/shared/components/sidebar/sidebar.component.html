<!-- Drawer: always full width, slides in/out over the content. -->
<aside
  class="sidebar border-r-2 border-r-border-primary flex flex-col w-72 h-full bg-white transition-all overflow-hidden"
>
  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden p-4">
    @if (isLoading()) {
      <div class="flex flex-col items-center justify-center gap-4 p-8">
        <div app-loading-spinner [isLoading]="isLoading()"></div>
      </div>
    } @else {
      <!-- Quick Links -->
      <div class="mb-6">
        <span
          class="block text-xs font-semibold uppercase tracking-wider px-3 mb-2 text-secondary"
          >Principal</span
        >
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          class="nav-item nav-item-hover"
          [class.active]="true"
        >
          <span class="text-sm font-medium whitespace-nowrap">Dashboard</span>
        </a>
      </div>

      <!-- Dynamic Menu -->
      @if (menuNodes().length > 0) {
        <div class="mb-6">
          <span
            class="block text-xs font-semibold uppercase tracking-wider px-3 mb-2 text-secondary"
            >Módulos</span
          >
          <app-tree-menu [menu]="menuNodes()" [level]="0" />
        </div>
      }
    }
  </nav>
</aside>
