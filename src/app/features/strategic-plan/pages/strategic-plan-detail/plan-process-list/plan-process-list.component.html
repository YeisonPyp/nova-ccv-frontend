<div
  class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden flex flex-col h-full"
>
  <div
    class="px-4 py-3 border-b border-gray-100 flex items-center justify-between"
  >
    <h3
      class="text-sm font-semibold text-secondary uppercase tracking-wider m-0"
    >
      Procesos
    </h3>
    <div class="flex items-center gap-2">
      <span class="text-xs text-gray-400">{{ processes().length }}</span>
      <button
        type="button"
        class="px-3 py-1.5 text-xs font-medium text-white bg-primary rounded-md hover:opacity-90 transition-opacity"
        (click)="openUpsert(null)"
      >
        +
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto">
    @if (processes().length === 0) {
      <div class="text-center py-6 text-tertiary text-sm">
        Sin procesos registrados.
      </div>
    } @else {
      <ul class="flex flex-col gap-2">
        @for (p of processes(); track p.id) {
          <li class="flex gap-3">
            <button
              type="button"
              class="w-[80%] px-4 py-3 text-left border-b border-gray-100 hover:bg-gray-50 transition-colors"
              [class.bg-blue-50]="selectedId() === p.id"
              [class.border-l-4]="selectedId() === p.id"
              [class.border-l-primary]="selectedId() === p.id"
              (click)="select(p)"
            >
              <span class="text-sm font-medium text-secondary">{{
                p.name
              }}</span>
            </button>
            <button
              type="button"
              class="w-[10%] items-center border-b border-gray-100 hover:bg-gray-50 transition-colors flex flex-col gap-1"
              (click)="openUpsert(p)"
            >
              <app-edit-icon />
            </button>
            <button
              type="button"
              class="w-[10%] items-center border-b border-gray-100 hover:bg-gray-50 transition-colors flex flex-col gap-1 text-red-500"
              (click)="deleteProcess(p, $event)"
            >
              <app-trash-icon />
            </button>
          </li>
        }
      </ul>
    }
  </div>
</div>

@if (modalOpen()) {
  <app-plan-process-modal
    [planName]="plan().name"
    [process]="processToUpsert()"
    (onSave)="onProcessSaved($event)"
    (closed)="modalOpen.set(false)"
  />
}
