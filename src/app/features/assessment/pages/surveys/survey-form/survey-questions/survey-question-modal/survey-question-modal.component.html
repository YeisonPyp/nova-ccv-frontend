@if (isOpen()) {
  <div class="modal-overlay" (click)="closeModal()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">
          {{ selectedQuestion() ? "Editar Pregunta" : "Nueva Pregunta" }}
        </h2>
        <button type="button" class="close-btn" (click)="closeModal()">
          &times;
        </button>
      </div>
      <form [formGroup]="questionForm" (ngSubmit)="submitQuestion()">
        <div class="modal-body space-y-4">
          <div class="form-group">
            <label>Descripción <span class="required">*</span></label>
            <textarea
              formControlName="description"
              class="form-control"
              rows="2"
            ></textarea>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div class="form-group">
              <label>Mínimo <span class="required">*</span></label>
              <input
                type="number"
                formControlName="minValue"
                class="form-control"
              />
            </div>
            <div class="form-group">
              <label>Máximo <span class="required">*</span></label>
              <input
                type="number"
                formControlName="maxValue"
                class="form-control"
              />
            </div>
            <div class="form-group">
              <label>Orden <span class="required">*</span></label>
              <input
                type="number"
                formControlName="displayOrder"
                min="1"
                class="form-control"
              />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">
            Cancelar
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="questionForm.invalid || submitting()"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
}
