<div class="flex flex-wrap gap-4">
  @for (element of elements(); track element.status) {
    <button
      type="button"
      [appStatusBadge]="element.status"
      class="group flex min-w-40 flex-1 items-center justify-between gap-4 rounded-xl px-5 py-4 text-left text-white shadow-sm transition-all duration-150 hover:-translate-y-0.5 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70 focus-visible:ring-offset-2 cursor-pointer"
      (click)="onClickStatus.emit(element.status)"
    >
      <span class="flex flex-col">
        <span class="text-2xl font-bold leading-none">
          {{ element.count }}
        </span>
        <span
          class="mt-1 text-xs font-medium uppercase tracking-wide text-white/85"
        >
          {{ element.status }}
        </span>
      </span>
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white/20 transition-colors group-hover:bg-white/30"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 5l7 7-7 7"
          />
        </svg>
      </span>
    </button>
  }
</div>
