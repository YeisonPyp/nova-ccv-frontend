<div class="dashboard-container min-h-full">
  <h1>Evaluación de Desempeño</h1>
  <div class="header-actions">
    <button class="btn btn-secondary" (click)="goToSurveys()">
      Encuestas de evaluación
    </button>
  </div>

  <div app-loading-spinner [isLoading]="isLoading()"></div>

  @if (!isLoading()) {
    <div class="flex flex-col">
      <div class="grid grid-cols-3 gap-4">
        @for (period of periods(); track period.id) {
          <app-period-card [period]="period" />
        }
      </div>

      <app-paginator
        [pageSize]="size()"
        [currentPage]="page()"
        [totalPages]="pages()"
        (pageSizeChange)="size.set($event)"
        (onSelectPage)="page.set($event)"
      ></app-paginator>
    </div>
  }
</div>
