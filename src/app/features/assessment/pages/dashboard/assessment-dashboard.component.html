<div class="dashboard-container min-h-full">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl">Evaluación de Desempeño</h1>
    <div class="flex items-center gap-2">
      <a
        routerLink="/assessment/assignments"
        class="px-4 py-2 text-sm font-medium text-primary bg-white border border-primary rounded-md hover:bg-primary/5 transition-colors"
      >
        Asignaciones
      </a>
      <a
        routerLink="/assessment/obligations"
        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:opacity-90 transition-opacity"
      >
        Mis Obligaciones
      </a>
    </div>
  </div>

  <div class="flex flex-col gap-y-5">
    <app-assessment-year-metrics />

    <div app-loading-spinner [isLoading]="isLoading()"></div>

    @if (!isLoading()) {
      <div class="flex flex-col py-3">
        <div class="grid grid-cols-3 gap-4">
          @for (period of periods(); track period.id) {
            <app-period-card [period]="period" />
          }
        </div>

        <app-paginator
          [pageSize]="size()"
          [currentPage]="page()"
          [totalPages]="pages()"
          (pageSizeChange)="size.set($event)"
          (onSelectPage)="page.set($event)"
        ></app-paginator>
      </div>
    }
  </div>
</div>
