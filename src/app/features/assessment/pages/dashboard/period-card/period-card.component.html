<button
  type="button"
  class="bg-background rounded-xl border border-border-primary shadow-sm p-5 text-left hover:border-primary transition-colors flex flex-col gap-4 cursor-pointer w-full min-h-77.5"
  (click)="onClick()"
>
  <!-- Header -->
  <div class="flex items-start justify-between gap-3">
    <div class="flex flex-col gap-1">
      <span
        class="text-[0.65rem] font-semibold text-tertiary uppercase tracking-widest"
      >
        Periodo
      </span>
      <h3 class="text-base font-semibold text-secondary m-0">
        {{ period().name }}
      </h3>
      <span class="text-xs text-tertiary">
        {{ period().startDate | date: "dd/MM/yyyy" }} —
        {{ period().endDate | date: "dd/MM/yyyy" }}
      </span>
    </div>
    @if (period().isActive) {
      <span
        class="inline-block px-2 py-0.5 rounded-full text-[0.6rem] font-semibold bg-primary/10 text-primary uppercase tracking-wider"
      >
        Activo
      </span>
    } @else {
      <span
        class="inline-block px-2 py-0.5 rounded-full text-[0.6rem] font-semibold bg-gray-100 text-tertiary uppercase tracking-wider"
      >
        Cerrado
      </span>
    }
  </div>

  <!-- Average score highlight -->
  <div class="flex items-baseline gap-2 py-3 border-y border-border-primary">
    <span
      class="text-[0.65rem] font-semibold text-tertiary uppercase tracking-widest"
    >
      Puntaje promedio
    </span>
    <span class="text-2xl font-bold text-primary ml-auto">
      {{ score() | number: "1.0-1" }}
    </span>
  </div>

  <!-- Metrics grid -->
  <div class="grid grid-cols-2 gap-3">
    <div class="flex flex-col gap-0.5">
      <span
        class="text-[0.6rem] font-semibold text-tertiary uppercase tracking-widest"
      >
        Evaluaciones
      </span>
      <span class="text-sm font-semibold text-secondary">
        {{ period().totalAssessments ?? 0 }}
      </span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span
        class="text-[0.6rem] font-semibold text-tertiary uppercase tracking-widest"
      >
        Respuestas
      </span>
      <span class="text-sm font-semibold text-secondary">
        {{ period().totalAnswers ?? 0 }}
      </span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span
        class="text-[0.6rem] font-semibold text-tertiary uppercase tracking-widest"
      >
        Evaluados
      </span>
      <span class="text-sm font-semibold text-secondary">
        {{ period().totalEvaluatees ?? 0 }}
      </span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span
        class="text-[0.6rem] font-semibold text-tertiary uppercase tracking-widest"
      >
        Evaluadores
      </span>
      <span class="text-sm font-semibold text-secondary">
        {{ period().totalEvaluators ?? 0 }}
      </span>
    </div>
  </div>

  <!-- Status counts -->
  @if ((period().statusCounts?.length ?? 0) > 0) {
    <div class="flex flex-col gap-2 pt-3 border-t border-border-primary">
      <span
        class="text-[0.6rem] font-semibold text-tertiary uppercase tracking-widest"
      >
        Estados
      </span>
      <div class="flex flex-wrap gap-1.5">
        @for (s of period().statusCounts; track s.status) {
          <span
            class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[0.65rem] font-semibold uppercase tracking-wider"
            [appStatusBadge]="s.status"
          >
            {{ s.status }}
            <span class="font-bold">{{ s.count }}</span>
          </span>
        }
      </div>
    </div>
  }
</button>
