<div class="modal-overlay" (click)="closeComponentModal()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">
        {{ selectedComponent() ? "Editar Componente" : "Nuevo Componente" }}
      </h2>
      <button type="button" class="close-btn" (click)="closeComponentModal()">
        &times;
      </button>
    </div>
    <form [formGroup]="componentForm" (ngSubmit)="onComponentSubmit()">
      <div class="modal-body space-y-4">
        <div class="form-group">
          <label>Nombre <span class="required">*</span></label>
          <input type="text" formControlName="name" class="form-control" />
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea
            formControlName="description"
            class="form-control"
            rows="2"
          ></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label>Valor Mínimo <span class="required">*</span></label>
            <input
              type="number"
              formControlName="minValue"
              step="0.01"
              min="0"
              class="form-control"
            />
          </div>
          <div class="form-group">
            <label>Valor Máximo <span class="required">*</span></label>
            <input
              type="number"
              formControlName="maxValue"
              step="0.01"
              class="form-control"
            />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="closeComponentModal()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="componentForm.invalid || submitting()"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
