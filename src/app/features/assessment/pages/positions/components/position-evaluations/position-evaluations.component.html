<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
  @for (section of sections; track section.type) {
    <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden flex flex-col">
      <div class="px-4 py-3 border-b border-gray-100">
        <h3 class="text-sm font-semibold text-secondary uppercase tracking-wider m-0">
          {{ section.label }}
        </h3>
        <span class="text-xs text-gray-500">{{ section.description }}</span>
      </div>

      <div class="p-4 flex flex-col gap-3">
        <app-context-search-select
          [ctx]="section.ctx"
          label="Agregar encuesta"
          [required]="false"
        />

        <ul class="flex flex-col gap-2">
          @for (pes of surveysFor(section.type); track pes.id) {
            <li class="flex items-center justify-between gap-3 px-3 py-2 border border-gray-100 rounded-md bg-gray-50">
              <div class="flex flex-col">
                <span class="text-sm font-medium text-secondary">{{ pes.survey.name }}</span>
                @if (pes.survey.description) {
                  <span class="text-xs text-gray-500">{{ pes.survey.description }}</span>
                }
              </div>
              <button
                type="button"
                class="text-red-500 hover:text-red-700"
                (click)="removeSurvey(section.type, pes.id)"
              >
                <app-trash-icon />
              </button>
            </li>
          } @empty {
            <li class="text-center py-4 text-xs text-tertiary">
              Sin encuestas asignadas.
            </li>
          }
        </ul>
      </div>
    </div>
  }
</div>
