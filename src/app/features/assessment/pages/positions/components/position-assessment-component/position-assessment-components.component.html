<div class="space-y-4">
  <div class="flex justify-end">
    <button class="btn btn-primary" (click)="openComponentModal(null)">
      + Nuevo Componente
    </button>
  </div>

  @if (loading()) {
    <div class="text-center py-4">
      <div
        class="inline-block h-6 w-6 animate-spin rounded-full border-4 border-solid border-indigo-600 border-r-transparent"
      ></div>
    </div>
  } @else {
    @for (comp of components(); track comp.id) {
      <app-assessment-component
        [comp]="comp"
        (onEditComponent)="openComponentModal($event)"
        (onDeleteComponent)="deleteComponent($event)"
        (onAddRequirement)="openRequirementModal(null, $event)"
        (onEditRequirement)="
          openRequirementModal($event.req, $event.componentId)
        "
        (onDeleteRequirement)="deleteRequirement($event)"
        (onUploadFile)="uploadFile($event.file, $event.requirementId)"
        (onDeleteFile)="deleteFile($event)"
      ></app-assessment-component>
    } @empty {
      <div
        class="text-center py-8 text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300"
      >
        No se han configurado componentes de evaluación para este cargo.
      </div>
    }
  }
</div>

@if (isComponentModalOpen()) {
  <app-position-assessment-component-modal
    [positionId]="positionId()"
    [selectedComponent]="selectedComponent()"
    [isComponentModalOpen]="isComponentModalOpen()"
    (onSubmit)="loadComponents()"
    (onClose)="closeComponentModal()"
  ></app-position-assessment-component-modal>
}

@if (isRequirementModalOpen()) {
  <app-component-requirement-modal
    [currentParentComponentId]="currentParentComponentId()!"
    [selectedRequirement]="selectedRequirement()"
    [isOpen]="isRequirementModalOpen()"
    (onSubmit)="loadComponents()"
    (onClose)="closeRequirementModal()"
  ></app-component-requirement-modal>
}
