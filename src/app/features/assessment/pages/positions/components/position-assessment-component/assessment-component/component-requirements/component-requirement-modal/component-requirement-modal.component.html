@if (isOpen()) {
  <div class="modal-overlay" (click)="closeComponentModal()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">
          {{
            selectedRequirement()
              ? "Editar Requerimiento"
              : "Nuevo Requerimiento"
          }}
        </h2>
        <button type="button" class="close-btn" (click)="closeComponentModal()">
          &times;
        </button>
      </div>
      <form [formGroup]="requirementForm" (ngSubmit)="onComponentSubmit()">
        <div class="modal-body space-y-4">
          <div class="form-group">
            <label>Nombre <span class="required">*</span></label>
            <input type="text" formControlName="name" class="form-control" />
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <textarea
              formControlName="description"
              class="form-control"
              rows="2"
            ></textarea>
          </div>
          <div class="form-group">
            <label
              >Máximo de Archivos permitidos
              <span class="required">*</span></label
            >
            <input
              type="number"
              formControlName="maxFiles"
              min="0"
              class="form-control"
            />
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="closeComponentModal()"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="requirementForm.invalid || submitting()"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
}
