<div
  class="border border-gray-200 rounded-lg p-4 bg-white shadow-sm flex flex-col gap-3"
  [formGroup]="form"
>
  <div class="flex justify-between items-start">
    <p class="text-sm text-gray-800 m-0">{{ answer().question.description }}</p>
  </div>

  <app-score-slider
    formControlName="score"
    [min]="answer().question.minValue || 0"
    [max]="answer().question.maxValue || 5"
    label="Puntuación"
  />

  <app-answer-comments
    [answer]="answer()"
    [canComment]="canComment()"
    [canReply]="canReply()"
  />
</div>
