<div
  class="w-full bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden"
>
  <div class="p-6">
    <div class="mb-6 border-b border-gray-200 pb-4">
      <h2 class="text-xl font-bold text-gray-900">Registrar nuevo usuario</h2>
      <p class="text-sm text-gray-500 mt-1">
        Ingresa los datos personales, cargo y configuración de acceso.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-8">
      <!-- Información Personal -->
      <div>
        <h3
          class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-4"
        >
          Información Personal
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <label
              class="form-label text-sm font-medium text-gray-700 mb-1 block"
            >
              Nombre <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              formControlName="firstName"
              placeholder="Ej: Juan"
            />
          </div>

          <div class="form-group">
            <label
              class="form-label text-sm font-medium text-gray-700 mb-1 block"
            >
              Apellido <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              formControlName="lastName"
              placeholder="Ej: Pérez"
            />
          </div>

          <div class="form-group">
            <label
              class="form-label text-sm font-medium text-gray-700 mb-1 block"
            >
              Identificación (UPIN) <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              formControlName="upin"
              placeholder="Número de documento"
            />
          </div>

          <div class="form-group">
            <label
              class="form-label text-sm font-medium text-gray-700 mb-1 block"
            >
              Correo electrónico <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="correo@ejemplo.com"
            />
          </div>
        </div>
      </div>

      <!-- Información Corporativa -->
      <div class="border-t border-gray-200 pt-6">
        <h3
          class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-4"
        >
          Información Corporativa
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <app-select-search
              label="Cargo *"
              placeholder="Selecciona un cargo"
              searchPlaceholder="Buscar cargo…"
              [maxElements]="1"
              [required]="true"
              [items]="positions()"
              [selectedItems]="selectedPositions()"
              (onSearch)="findPositions($event)"
              (onRemove)="onRemovePosition($event)"
              (onSelect)="onSelectPosition($event)"
            />
          </div>

          <div class="form-group">
            <app-select-search
              label="Reporta a (Jefe Directo)"
              placeholder="Selecciona un empleado"
              searchPlaceholder="Buscar por nombre o correo…"
              [maxElements]="1"
              [items]="employees()"
              [selectedItems]="selectedEmployees()"
              (onSearch)="findEmployees($event)"
              (onRemove)="onRemoveReportsTo($event)"
              (onSelect)="onSelectReportsTo($event)"
            />
          </div>

          <div class="form-group">
            <label
              class="form-label text-sm font-medium text-gray-700 mb-1 block"
            >
              Franja horaria <span class="text-red-500">*</span>
            </label>
            <select
              class="form-control"
              app-selector
              [options]="schedules() || []"
              formControlName="scheduleId"
            ></select>
          </div>
        </div>
      </div>

      <!-- Configuración de Acceso -->
      <div class="border-t border-gray-200 pt-6">
        <h3
          class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-4"
        >
          Configuración de Acceso
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <label
              class="form-label text-sm font-medium text-gray-700 mb-1 block"
            >
              Rol del Sistema <span class="text-red-500">*</span>
            </label>
            <select
              class="form-control"
              app-selector
              [options]="roles() || []"
              formControlName="roleId"
            ></select>
          </div>

          <div class="form-group">
            <label
              class="form-label text-sm font-medium text-gray-700 mb-1 block"
            >
              Contraseña
            </label>
            <input
              type="password"
              class="form-control"
              formControlName="password"
              placeholder="Mínimo 8 caracteres"
            />
            <p class="text-xs text-gray-500 mt-1">
              Opcional. Si se omite, se generará una automáticamente.
            </p>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="pt-6 border-t border-gray-200 flex justify-end gap-3">
        <button
          type="button"
          class="btn btn-secondary"
          [disabled]="creating()"
          onclick="window.history.back()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="creating() || form.invalid"
        >
          {{ creating() ? "Creando usuario..." : "Crear usuario" }}
        </button>
      </div>
    </form>
  </div>
</div>
