@if (!canRead) {
  <app-forbidden />
} @else {
  <div class="p-6 space-y-4">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-secondary">Usuarios</h1>
        <p class="text-tertiary text-sm">Gestión de usuarios del sistema</p>
      </div>
      <div class="flex items-center gap-2">
        @if (canCreate) {
          <button class="btn btn-outline" (click)="openSeedModal()">
            <i class="fas fa-file-excel"></i> Sembrar usuarios
          </button>
        }
        <button class="btn btn-primary" (click)="onCreateClicked()">
          <i class="fas fa-plus"></i> Nuevo Usuario
        </button>
      </div>
    </div>

    <app-dynamic-table
      [data]="users()"
      [columns]="columns"
      emptyMessage="No hay usuarios."
      (searchChange)="onSearchChange($event)"
    >
      <ng-template #actions let-user>
        @if (canUpdate) {
          <button class="btn btn-sm btn-primary" (click)="manage(user)">
            Gestionar
          </button>
        }
      </ng-template>
    </app-dynamic-table>

    <app-pagination
      [pages]="totalPages()"
      [currentPage]="page()"
      (pageChange)="page.set($event)"
    />
  </div>

  @if (seedModalOpen()) {
    <app-seed-users-modal
      (onClose)="closeSeedModal()"
      (onSeeded)="onUsersSeeded()"
    />
  }
}
