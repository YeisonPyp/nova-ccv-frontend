@if (!canRead) {
  <app-forbidden />
} @else {
  <div class="p-6 space-y-4">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-secondary">Usuarios</h1>
        <p class="text-tertiary text-sm">Gestión de usuarios del sistema</p>
      </div>
      <button class="btn btn-primary" (click)="onCreateClicked()">
        <i class="fas fa-plus"></i> Nuevo Usuario
      </button>
    </div>

    @if (loading()) {
      <div class="text-center py-8">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    } @else {
      <app-dynamic-table
        [data]="users()"
        [columns]="columns"
        emptyMessage="No hay usuarios."
      >
        <ng-template #actions let-user>
          @if (canUpdate) {
            <button class="btn btn-sm btn-primary" (click)="manage(user)">
              Gestionar
            </button>
          }
        </ng-template>
      </app-dynamic-table>

      <app-pagination
        [pages]="totalPages()"
        [currentPage]="page()"
        (pageChange)="load($event)"
      />
    }
  </div>
}
