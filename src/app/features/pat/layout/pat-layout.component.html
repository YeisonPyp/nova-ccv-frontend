<div class="flex items-center justify-between">
  <h1 class="text-2xl font-bold text-secondary m-0">Plan Anual de Trabajo</h1>
  <div class="flex items-center gap-2">
    <label
      for="pat-year"
      class="text-xs font-semibold text-gray-500 uppercase tracking-wide"
    >
      Año
    </label>
    <input
      id="pat-year"
      type="number"
      min="2000"
      max="2100"
      step="1"
      class="text-sm rounded border border-gray-200 px-3 py-1.5 bg-white w-24 focus:outline-none focus:ring-1 focus:ring-primary"
      [value]="year()"
      (change)="onYearChange($event)"
    />
  </div>
</div>
