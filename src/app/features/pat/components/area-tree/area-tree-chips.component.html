<details class="group/item border border-gray-200 rounded-lg shadow-sm">
  <summary
    class="flex items-center justify-between p-3 cursor-pointer bg-white hover:bg-gray-50 transition-all border-b border-gray-50 group/item"
  >
    <div class="flex items-center gap-1.5 text-xs text-gray-500 flex-wrap">
      <svg
        class="w-3.5 h-3.5 transition-transform group-open/item:rotate-90"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5l7 7-7 7"
        />
      </svg>
      <button
        type="button"
        class="font-medium transition-colors"
        [class]="
          selectedId() === null
            ? 'text-primary'
            : 'text-gray-400 hover:text-primary'
        "
        (click)="clear()"
      >
        Todas
      </button>
      @for (name of breadcrumb(); track $index) {
        <span class="text-gray-300">›</span>
        <span class="text-gray-600">{{ name }}</span>
      }
    </div>
  </summary>
  <div class="p-3 flex flex-col gap-2">
    <!-- Navegación entre niveles: solo se muestra el nivel actual -->
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="px-2 py-1 text-xs font-medium rounded border transition-colors"
        [class]="
          canGoBack()
            ? 'border-gray-300 text-gray-600 hover:border-primary hover:text-primary'
            : 'border-gray-200 text-gray-300 cursor-not-allowed'
        "
        [disabled]="!canGoBack()"
        (click)="clear()"
      >
        <app-home-icon [size]="10" />
      </button>

      <button
        type="button"
        class="px-2 py-1 text-xs font-medium rounded border transition-colors"
        [class]="
          canGoBack()
            ? 'border-gray-300 text-gray-600 hover:border-primary hover:text-primary'
            : 'border-gray-200 text-gray-300 cursor-not-allowed'
        "
        [disabled]="!canGoBack()"
        (click)="back()"
      >
        ‹
      </button>
    </div>

    <div
      class="flex flex-col flex-wrap gap-1 max-h-44 overflow-y-auto p-1 rounded-md border border-gray-200 bg-gray-50"
    >
      @for (node of currentColumn(); track node.id) {
        <button
          type="button"
          class="flex items-center gap-2 px-2.5 py-1 text-xs font-medium rounded whitespace-nowrap text-left transition-colors"
          [class]="
            isSelected(currentLevel(), node.id)
              ? 'bg-primary text-white'
              : 'bg-white text-gray-600 hover:text-primary'
          "
          [title]="typeLabels[node.type]"
          (click)="select(currentLevel(), node.id)"
        >
          <span>{{ node.name }}</span>
          @if (node.children.length) {
            <span
              class="text-[10px]"
              [class]="
                isSelected(currentLevel(), node.id)
                  ? 'text-white/90'
                  : 'text-gray-500'
              "
            >
              ›
            </span>
          }
        </button>
      } @empty {
        <span class="px-2 py-1 text-xs text-gray-400">Sin áreas.</span>
      }
    </div>
  </div>
</details>
