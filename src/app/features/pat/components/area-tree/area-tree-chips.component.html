<details class="group/item border border-gray-200 rounded-lg shadow-sm">
  <summary
    class="flex items-center justify-between p-3 cursor-pointer bg-white hover:bg-gray-50 transition-all border-b border-gray-50 group/item"
  >
    <div class="flex items-center gap-1.5 text-xs text-gray-500 flex-wrap">
      <svg
        class="w-3.5 h-3.5 transition-transform group-open/item:rotate-90"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5l7 7-7 7"
        />
      </svg>
      <button
        type="button"
        class="font-medium transition-colors"
        [class]="
          selectedId() === null
            ? 'text-primary'
            : 'text-gray-400 hover:text-primary'
        "
        (click)="clear()"
      >
        Todas
      </button>
      @for (name of breadcrumb(); track $index) {
        <span class="text-gray-300">›</span>
        <span class="text-gray-600">{{ name }}</span>
      }
    </div>
  </summary>
  <div class="flex items-stretch gap-2 overflow-x-auto pb-1">
    @for (column of columns(); track $index; let level = $index) {
      @if (level > 0) {
        <div class="flex items-center text-gray-300 shrink-0">›</div>
      }

      <div
        class="flex flex-col gap-1 shrink-0 max-h-44 overflow-y-auto p-1 rounded-md border border-gray-200 bg-gray-50"
      >
        @for (node of column; track node.id) {
          <button
            type="button"
            class="flex items-center gap-2 px-2.5 py-1 text-xs font-medium rounded whitespace-nowrap text-left transition-colors"
            [class]="
              isSelected(level, node.id)
                ? 'bg-primary text-white'
                : 'bg-white text-gray-600 hover:text-primary'
            "
            [title]="typeLabels[node.type]"
            (click)="select(level, node.id)"
          >
            <span>{{ node.name }}</span>
            @if (node.children?.length) {
              <span
                class="text-[10px]"
                [class]="
                  isSelected(level, node.id) ? 'text-white/70' : 'text-gray-300'
                "
              >
                ›
              </span>
            }
          </button>
        }
      </div>
    }
  </div>
</details>
