<div class="flex flex-col gap-4">
  <app-dynamic-table
    [data]="tasks()"
    [columns]="columns"
    emptyMessage="No hay tareas."
    (searchChange)="onSearchChange($event)"
  >
    <ng-template #actions let-item>
      <a
        [routerLink]="['/pat', year(), 'activities', item.activityId]"
        class="text-xs font-medium text-primary hover:underline whitespace-nowrap"
      >
        Ver actividad →
      </a>
    </ng-template>
  </app-dynamic-table>

  <app-paginator
    [totalPages]="totalPages()"
    [currentPage]="page()"
    [pageSize]="size()"
    (onSelectPage)="page.set($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</div>
