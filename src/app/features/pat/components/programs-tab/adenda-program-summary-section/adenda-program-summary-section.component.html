<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h3
      class="text-sm font-semibold text-secondary uppercase tracking-wider m-0"
    >
      Resumen de Programas por Adenda
    </h3>
  </div>

  <div class="flex items-end gap-4">
    <div class="w-64">
      <app-context-search-select
        [ctx]="adendaCtx"
        label="Adenda"
        [required]="false"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label
        class="text-[0.7rem] font-medium text-gray-500 uppercase tracking-wide"
      >
        Año
      </label>
      <input
        type="number"
        [ngModel]="yearFilter()"
        (ngModelChange)="onYearInputChange($event)"
        class="text-sm rounded border border-gray-200 px-3 py-2 w-32 focus:outline-none focus:ring-1 focus:ring-primary"
      />
    </div>
  </div>

  <app-dynamic-table
    [data]="items()"
    [columns]="columns"
    [exportable]="false"
    emptyMessage="No hay programas para los filtros seleccionados."
  >
    <ng-template #actions let-item>
      <button
        type="button"
        class="text-xs font-medium text-primary hover:underline whitespace-nowrap disabled:opacity-50"
        [disabled]="resolvingId() === item.programCode"
        (click)="viewProgram(item)"
      >
        @if (resolvingId() === item.programCode) {
          Abriendo...
        } @else {
          Ver detalle →
        }
      </button>
    </ng-template>
  </app-dynamic-table>
</div>
