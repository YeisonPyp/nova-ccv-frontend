<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h3
      class="text-sm font-semibold text-secondary uppercase tracking-wider m-0"
    >
      Programas {{ year() }}
    </h3>

    <button
      type="button"
      class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:opacity-90 transition-opacity"
      (click)="openCreate()"
    >
      + Nuevo programa
    </button>
  </div>

  <app-programs-table [year]="year()" (onEdit)="openEdit($event)" />
</div>

<app-create-pat-program
  [isOpen]="modalOpen()"
  [year]="year()"
  [program]="editing()"
  (onClose)="closeModal()"
  (onSaved)="onSaved()"
/>
