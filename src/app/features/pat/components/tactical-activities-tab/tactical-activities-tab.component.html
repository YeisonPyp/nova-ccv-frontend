<div class="flex flex-col gap-4">
  <div class="flex justify-end">
    <button class="btn btn-primary" (click)="openCreate()">
      + Nueva Actividad Táctica
    </button>
  </div>

  <app-dynamic-table
    [data]="activities()"
    [columns]="columns"
    emptyMessage="No hay actividades tácticas."
    (searchChange)="onSearchChange($event)"
  >
    <ng-template #actions let-item>
      <a
        [routerLink]="['/pat', year(), 'activities', item.id]"
        class="text-xs font-medium text-primary hover:underline whitespace-nowrap"
      >
        Ver detalle →
      </a>
    </ng-template>
  </app-dynamic-table>

  <app-paginator
    [totalPages]="totalPages()"
    [currentPage]="page()"
    [pageSize]="size()"
    (onSelectPage)="page.set($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</div>
