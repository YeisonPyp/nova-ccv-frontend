<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h3
      class="text-sm font-semibold text-secondary uppercase tracking-wider m-0"
    >
      Projectos {{ year() }}
    </h3>

    <button
      type="button"
      class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:opacity-90 transition-opacity"
      (click)="openCreate()"
    >
      + Nuevo Proyecto
    </button>
  </div>

  <div app-loading-spinner [isLoading]="isLoading()"></div>

  <div class="flex flex-col gap-4 px-2 py-2">
    @if (!isLoading()) {
      @for (project of projects(); track project.id) {
        <app-project-card [project]="project" />
      }
    }
  </div>
</div>
