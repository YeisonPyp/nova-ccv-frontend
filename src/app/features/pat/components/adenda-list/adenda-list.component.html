<div class="flex flex-col gap-3 h-full">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-semibold text-secondary uppercase tracking-wider m-0">
      Adendas
    </h3>
    <button
      type="button"
      class="w-6 h-6 flex items-center justify-center rounded-full bg-primary text-white text-sm leading-none"
      title="Nueva adenda"
      (click)="openCreate()"
    >
      +
    </button>
  </div>

  @if (loading()) {
    <p class="text-xs text-gray-400">Cargando...</p>
  } @else if (adendas().length === 0) {
    <p class="text-xs text-gray-400">Sin adendas registradas.</p>
  } @else {
    <ul class="flex flex-col gap-1">
      @for (adenda of adendas(); track adenda.id) {
        <li>
          <button
            type="button"
            class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded-md text-left text-sm transition-colors"
            [class]="
              selectedId() === adenda.id
                ? 'bg-primary/10 text-primary font-medium'
                : 'text-gray-600 hover:bg-gray-100'
            "
            (click)="select(adenda)"
          >
            <span>{{ adenda.name }}</span>
            <span
              class="text-xs text-gray-400 hover:text-primary"
              (click)="openEdit(adenda, $event)"
            >
              ✏️
            </span>
          </button>
        </li>
      }
    </ul>
  }
</div>

<app-adenda-upsert-modal
  [isOpen]="modalOpen()"
  [adenda]="editing()"
  (onClose)="closeModal()"
  (onSaved)="onSaved()"
/>
