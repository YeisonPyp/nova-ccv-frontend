<div class="flex flex-col gap-6">
  <div class="max-w-sm">
    <app-context-search-select [ctx]="positionCtx" label="Cargo que registra" [required]="true" />
    <p class="text-xs text-gray-400 mt-1">
      El valor de cada celda corresponde al aporte del cargo seleccionado para ese rubro y mes.
    </p>
  </div>

  @if (rubros().length === 0) {
    <p class="text-sm text-gray-400 text-center py-8">
      Esta actividad táctica no tiene rubros presupuestales aprobados.
    </p>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      @for (rubro of rubros(); track rubro.id) {
        <app-monthly-values-grid
          [title]="rubro.name"
          [values]="valuesFor(rubro.id)"
          [referenceValues]="mode() === 'execution' ? planValuesFor(rubro.id) : []"
          referenceLabel="Planeado"
          [disabled]="!selectedPositionId()"
          (save)="save(rubro.id, $event)"
        />
      }
    </div>
  }
</div>
