<div class="w-full p-6">
  <button class="btn btn-link text-sm text-gray-500 mb-4 ps-0" (click)="goBack()">
    ← Volver a la actividad
  </button>

  <div app-loading-spinner [isLoading]="loading()"></div>

  @if (!loading() && task(); as t) {
    <div class="flex items-start justify-between mb-6">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-mono text-gray-400 bg-gray-100 px-2 py-0.5 rounded">
            {{ t.activityName }}
          </span>
        </div>
        <h1 class="text-2xl font-bold text-secondary m-0">{{ t.name }}</h1>
        @if (t.description) {
          <p class="text-sm text-gray-500 mt-1">{{ t.description }}</p>
        }
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
      <div class="bg-white rounded-lg border border-gray-200 p-4 shadow-sm">
        <p class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest mb-1">
          Área
        </p>
        <p class="text-sm font-medium text-gray-700">{{ t.area?.name ?? "—" }}</p>
      </div>

      <div class="bg-white rounded-lg border border-gray-200 p-4 shadow-sm">
        <p class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest mb-1">
          Centro de Costo
        </p>
        <p class="text-sm font-medium text-gray-700">{{ t.costCenter?.name ?? "—" }}</p>
      </div>
    </div>

    <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-6 mb-6">
      <h5 class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest mb-3">
        Presupuesto Planeado vs. Ejecutado
      </h5>
      <div class="max-w-xs mx-auto">
        <app-execution-pie-chart
          [planned]="plannedTotal()"
          [executed]="executedTotal()"
        />
      </div>
    </div>

    <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
      <div class="flex border-b border-gray-200 bg-gray-50 px-2 pt-2 gap-2">
        @for (tab of tabs; track tab.key) {
          <button
            type="button"
            class="px-5 py-2.5 text-sm font-medium cursor-pointer border-b-2 transition-colors duration-150 rounded-t-lg -mb-px"
            [class]="
              activeTab() === tab.key
                ? 'text-primary border-primary bg-white'
                : 'text-gray-500 border-transparent hover:text-primary hover:bg-gray-100'
            "
            (click)="activeTab.set(tab.key)"
          >
            {{ tab.label }}
          </button>
        }
      </div>

      <div class="p-6">
        <app-monthly-overview-grid
          [overview]="overview()"
          [mode]="activeTab() === 'plan' ? 'plan' : 'execution'"
          (onRegister)="openRegister($event)"
        />
      </div>
    </div>

    <app-register-monthly-overview-modal
      [isOpen]="registerModalOpen()"
      [taskId]="t.id"
      [mode]="activeTab() === 'plan' ? 'plan' : 'execution'"
      [data]="registerData()"
      (onClose)="closeRegister()"
      (onSaved)="onOverviewSaved($event)"
    />
  }
</div>
