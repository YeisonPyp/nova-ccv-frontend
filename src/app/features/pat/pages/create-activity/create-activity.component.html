<div class="w-full p-6">
  <div class="flex items-center gap-3 mb-6">
    <h2 class="text-xl font-bold text-secondary m-0">Nueva Actividad PAT</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6">
    <!-- ── IDENTIFICACIÓN ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-secondary uppercase tracking-widest mb-4"
      >
        Identificación
      </h5>
      <div class="grid grid-cols-4 gap-x-6 gap-y-4">
        <div class="flex flex-col gap-1">
          <label
            class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
          >
            Código <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            formControlName="code"
            [appFormFieldError]="{
              maxlength: 'Máximo 50 caracteres',
            }"
            class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
          />
        </div>

        <div class="col-span-2 flex flex-col gap-1">
          <label
            class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
          >
            Nombre <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            formControlName="name"
            [appFormFieldError]="{ maxlength: 'Máximo 255 caracteres' }"
            placeholder="Nombre de la actividad"
            class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
          />
        </div>
      </div>
    </section>

    <!-- ── RESPONSABLE Y ORGANIZACIÓN ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-secondary uppercase tracking-widest mb-4"
      >
        Responsable y Organización
      </h5>
      <div class="grid grid-cols-3 gap-x-6 gap-y-4">
        <app-context-search-select
          label="Responsable"
          [required]="true"
          [ctx]="employeeCtx"
        />

        <app-context-search-select
          [label]="'Centro de Costo'"
          [required]="true"
          [ctx]="costCenterCtx"
        />

        <app-context-search-select
          [label]="'Actividad Táctica'"
          [required]="true"
          [ctx]="tacticalActivityCtx"
        />
      </div>
    </section>

    <!-- ── CLASIFICACIÓN ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-secondary uppercase tracking-widest mb-4"
      >
        Clasificación
      </h5>
      <div class="grid grid-cols-3 gap-x-6 gap-y-4">
        <app-context-search-select
          [label]="'Programa estratégico'"
          [required]="false"
          [ctx]="programCtx()"
        />

        <app-context-search-select
          [label]="'Política'"
          [required]="false"
          [ctx]="policyCtx"
        />
      </div>
    </section>

    <!-- ── INDICADORES Y MEDICIÓN ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-secondary uppercase tracking-widest mb-4"
      >
        Indicadores y Medición
      </h5>
      <div class="grid grid-cols-3 gap-x-6 gap-y-4">
        <app-context-search-select
          [label]="'Unidad de Medida'"
          [required]="true"
          [ctx]="measurementCtx"
        />

        <app-context-search-select
          [label]="'Indicador de gestión'"
          [required]="true"
          [ctx]="cuantitativeIndicatorCtx"
        />

        <div class="flex flex-col gap-1">
          <label
            class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
            >Meta de Medición</label
          >
          <input
            type="number"
            formControlName="measurementGoal"
            placeholder="0"
            class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label
            class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
            >Línea Base del Indicador</label
          >
          <input
            type="number"
            formControlName="indicatorBaseLine"
            placeholder="0"
            class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label
            class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
            >Meta del Indicador</label
          >
          <input
            type="number"
            formControlName="indicatorGoal"
            placeholder="0"
            class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
          />
        </div>
      </div>
    </section>

    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-secondary uppercase tracking-widest mb-4"
      >
        Beneficiarios
      </h5>
      <div class="grid grid-cols-3 gap-x-6 gap-y-4">
        <app-context-search-select
          label="Tipo de Beneficiarios"
          [required]="true"
          [ctx]="benefitCtx"
        />

        <div class="flex flex-col gap-1">
          <label
            class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
            >Total de beneficiarios</label
          >
          <input
            type="number"
            formControlName="benefitAmount"
            placeholder="0"
            class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
          />
        </div>
      </div>
    </section>

    <!-- ── VIGENCIA ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-secondary uppercase tracking-widest mb-4"
      >
        Vigencia
      </h5>
      <div class="grid grid-cols-3 gap-x-6 gap-y-4">
        <div class="flex flex-col gap-1">
          <label
            class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
          >
            Fecha de Inicio <span class="text-red-500">*</span>
          </label>
          <input
            type="date"
            formControlName="startsAt"
            formFieldError
            class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label
            class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
          >
            Fecha de Fin <span class="text-red-500">*</span>
          </label>
          <input
            type="date"
            formControlName="endsAt"
            formFieldError
            class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
          />
        </div>
      </div>
    </section>

    <!-- ── DESCRIPCIÓN ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-secondary uppercase tracking-widest mb-4"
      >
        Descripción
      </h5>
      <div class="flex flex-col gap-1">
        <label
          class="text-[0.7rem] font-medium text-secondary uppercase tracking-wide"
          >Descripción</label
        >
        <textarea
          formControlName="description"
          [appFormFieldError]="{ maxlength: 'Máximo 1000 caracteres' }"
          rows="4"
          placeholder="Descripción de la actividad..."
          class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary resize-none"
        ></textarea>
      </div>
    </section>

    <!-- ── FOOTER ── -->
    <div class="flex justify-end gap-3 pb-8">
      <button
        type="submit"
        class="px-5 py-2 text-sm font-medium text-white bg-primary rounded-md hover:opacity-90 transition-opacity cursor-pointer border-none disabled:opacity-50"
        [disabled]="submitting()"
      >
        @if (submitting()) {
          Creando...
        } @else {
          Crear Actividad
        }
      </button>
    </div>
  </form>
</div>
