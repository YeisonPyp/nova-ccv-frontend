<div class="flex flex-col gap-4">
  <!-- ── Areas + section controls ─────────────────────────────────────── -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <app-area-tree-chips (selectedChange)="onAreaChange($event)" />

    <div class="flex flex-wrap items-center gap-4">
      @for (section of sections; track section.key) {
        <label
          class="flex items-center gap-1.5 text-sm text-gray-600 cursor-pointer"
        >
          <input
            type="checkbox"
            class="accent-primary w-4 h-4"
            [checked]="isSectionVisible(section.key)"
            (change)="toggleSection(section.key)"
          />
          {{ section.label }}
        </label>
      }
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
    <!-- ── Left column: 5 de 12 columnas (41.6% aprox) ────────────────── -->
    <div class="lg:col-span-5 flex flex-col gap-4">
      @if (isSectionVisible("programs")) {
        <app-programs-section
          [year]="year()"
          [areaId]="areaId()"
          (onSelectedPrograms)="onProgramChange($event)"
        />
      }

      @if (isSectionVisible("tasks")) {
        <app-tasks-section
          class="h-full"
          [year]="year()"
          [areaId]="areaId()"
          [programId]="programId()"
          (selectedActivities)="onTasksChange($event)"
        />
      }
    </div>

    <!-- ── Right column: 7 de 12 columnas (58.3% aprox) ───────────────── -->
    <div class="lg:col-span-7 flex flex-col gap-4">
      @if (isSectionVisible("budget")) {
        <app-budget-section
          [year]="year()"
          [areaId]="areaId()"
          [programId]="programId()"
          [taskIds]="taskIds()"
        />
      }

      @if (isSectionVisible("indicators")) {
        <app-indicator-progress-list
          [year]="year()"
          [areaId]="areaId()"
          [taskIds]="taskIds()"
        />
      }
    </div>
  </div>
</div>
