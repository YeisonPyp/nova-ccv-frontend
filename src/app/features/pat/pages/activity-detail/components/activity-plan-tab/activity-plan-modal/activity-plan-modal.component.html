@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
    (click)="closeModal()"
  >
    <div
      class="bg-background rounded-xl shadow-xl w-full max-w-lg m-4 overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <div
        class="flex items-center justify-between px-6 py-4 border-b border-border-primary"
      >
        <h3 class="text-base font-semibold text-secondary m-0">
          {{ modalTitle() }}
        </h3>
        <button
          type="button"
          class="text-tertiary hover:text-primary text-xl leading-none"
          (click)="closeModal()"
        >
          ×
        </button>
      </div>

      <form
        [formGroup]="form"
        class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4"
      >
        <div class="form-group">
          <label>Presupuesto Planeado</label>
          <input
            type="text"
            appCurrencyFormat
            formControlName="plannedBudget"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Beneficio Planeado</label>
          <input
            type="text"
            appCurrencyFormat
            formControlName="plannedBenefit"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Meta de Medición</label>
          <input
            type="text"
            appCurrencyFormat
            formControlName="plannedMeasurementGoal"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Meta de Indicador</label>
          <input
            type="text"
            appCurrencyFormat
            formControlName="plannedIndicatorGoal"
            class="form-control"
          />
        </div>

        <div
          class="md:col-span-2 flex justify-end gap-2 pt-2 border-t border-border-primary"
        >
          <button
            type="button"
            class="btn btn-secondary"
            (click)="closeModal()"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
}
