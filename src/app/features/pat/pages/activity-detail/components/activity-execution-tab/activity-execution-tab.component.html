<div class="flex flex-col gap-6">
  <section
    class="bg-background rounded-xl border border-border-primary shadow-sm overflow-hidden"
  >
    <div class="px-6 py-4 border-b border-border-primary">
      <h3
        class="text-sm font-semibold text-secondary uppercase tracking-wider m-0"
      >
        Registrar Ejecución
      </h3>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
    >
      <div class="form-group">
        <label>Mes (1-12)</label>
        <input
          type="month"
          formControlName="month"
          min="1"
          max="12"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label>Presupuesto Ejecutado</label>
        <input
          type="text"
          appCurrencyFormat
          formControlName="executedBudget"
          step="0.01"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label>Beneficio Ejecutado</label>
        <input
          type="text"
          appCurrencyFormat
          formControlName="executedBenefit"
          step="0.01"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label>Meta de Medición Ejecutada</label>
        <input
          type="text"
          appCurrencyFormat
          formControlName="executedMeasurementGoal"
          step="0.01"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label>Meta de Indicador Ejecutada</label>
        <input
          type="text"
          appCurrencyFormat
          formControlName="executedIndicatorGoal"
          step="0.00001"
          class="form-control"
        />
      </div>
      <div class="form-group md:col-span-2 lg:col-span-3">
        <label>Descripción</label>
        <textarea
          formControlName="description"
          rows="2"
          class="form-control"
        ></textarea>
      </div>
      <div class="md:col-span-2 lg:col-span-3 flex justify-end">
        <button
          type="submit"
          [disabled]="form.invalid || submitting"
          class="btn btn-primary"
        >
          Guardar Ejecución
        </button>
      </div>
    </form>
  </section>

  <!-- Table -->
  <section
    class="bg-background rounded-xl border border-border-primary shadow-sm p-4"
  >
    <app-pagination-table [service]="service" [tableColumns]="columns" />
  </section>
</div>
