<div class="p-6 max-w-9xl mx-auto flex flex-col gap-6">
  <div class="flex items-center justify-between">
    <div class="flex flex-col gap-1">
      <label
        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:opacity-90 transition-opacity cursor-pointer inline-flex items-center gap-2 w-fit"
        [class.opacity-60]="uploading()"
      >
        @if (uploading()) {
          Cargando...
        } @else {
          Cargar Excel PAT
        }
        <input
          type="file"
          accept=".xlsx,.xls"
          class="hidden"
          [disabled]="uploading()"
          (change)="onSeedFileSelected($event)"
        />
      </label>
      @if (uploadError()) {
        <span class="text-xs text-red-600">{{ uploadError() }}</span>
      }
    </div>
  </div>

  <!-- Area chips -->
  <div class="flex flex-wrap gap-2">
    <button
      type="button"
      class="px-4 py-1.5 text-sm font-medium rounded-full border transition-colors"
      [class]="
        selectedAreaId() === null
          ? 'bg-primary text-white border-primary'
          : 'bg-white text-gray-600 border-gray-300 hover:border-primary hover:text-primary'
      "
      (click)="selectArea(null)"
    >
      Todas
    </button>
    @for (area of areas(); track area.id) {
      <button
        type="button"
        class="px-4 py-1.5 text-sm font-medium rounded-full border transition-colors"
        [class]="
          selectedAreaId() === area.id
            ? 'bg-primary text-white border-primary'
            : 'bg-white text-gray-600 border-gray-300 hover:border-primary hover:text-primary'
        "
        (click)="selectArea(area.id)"
      >
        {{ area.name }}
      </button>
    }
  </div>

  <!-- Budget charts -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
      <app-execution-pie-chart
        title="Presupuesto planeado vs ejecutado"
        [planned]="totalPlanned()"
        [executed]="totalExecuted()"
      />
    </div>
    <div
      class="bg-white rounded-lg border border-gray-200 shadow-sm p-4 md:col-span-2"
    >
      <app-planned-executed-line-chart
        title="Presupuesto mensual"
        [plannedValues]="plannedValues()"
        [executedValues]="executedValues()"
      />
    </div>
  </div>
  <!-- Tabs -->
  <div
    class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden"
  >
    <div class="flex border-b border-gray-200 bg-gray-50 px-2 pt-2 gap-2">
      @for (tab of tabs; track tab.key) {
        <button
          type="button"
          class="px-5 py-2.5 text-sm font-medium cursor-pointer border-b-2 transition-colors duration-150 rounded-t-lg -mb-px"
          [class]="
            activeTab() === tab.key
              ? 'text-primary border-primary bg-white'
              : 'text-gray-500 border-transparent hover:text-primary hover:bg-gray-100'
          "
          (click)="setTab(tab.key)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    <div class="p-6 min-h-100">
      <ng-container
        [ngComponentOutlet]="activeTabComponent()"
        [ngComponentOutletInputs]="activeTabInputs()"
      ></ng-container>
    </div>
  </div>
</div>
