<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold text-secondary">Candidatos de Auditoría</h1>
  </div>

  <app-pagination-table [service]="service" [tableColumns]="columns()">
    <ng-template #actions let-item>
      <div class="flex gap-2 justify-center items-center">
        <div class="form-check form-switch mb-0">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            [checked]="item.isEnabled"
            (change)="toggleEnabled(item)"
            [title]="
              item.isEnabled ? 'Deshabilitar auditoría' : 'Habilitar auditoría'
            "
          />
        </div>
        <button
          class="btn btn-sm btn-outline-secondary"
          title="Ver logs"
          (click)="viewLogs(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
            />
          </svg>
        </button>
      </div>
    </ng-template>
  </app-pagination-table>

  @if (selectedCandidate(); as candidate) {
    <div class="flex justify-between items-center mb-4 mt-4">
      <h1 class="text-2xl font-bold text-secondary">Logs de auditoría</h1>
    </div>
    <app-audit-logs [candidate]="candidate"></app-audit-logs>
  }
</div>
