<details class="border rounded-lg" (toggle)="onPositionsToggle($event)">
  <summary
    class="px-4 py-3 cursor-pointer font-semibold text-secondary select-none"
  >
    Cargos
  </summary>

  <div class="p-4 space-y-3">
    @if (!positionsLoaded()) {
      <div class="text-center py-6 text-tertiary text-sm">Cargando...</div>
    } @else {
      @if (canCreatePosition) {
        <div class="flex justify-end">
          <button class="btn btn-primary btn-sm" (click)="openCreatePosition()">
            + Nuevo cargo
          </button>
        </div>
      }

      <app-dynamic-table
        [data]="positions()"
        [columns]="positionColumns"
        emptyMessage="No hay cargos."
      >
        <ng-template #actions let-item>
          @if (canUpdatePosition) {
            <button
              class="btn btn-sm btn-outline"
              (click)="openEditPosition(item)"
            >
              Editar
            </button>
          }
          @if (canDeletePosition) {
            <button
              class="btn btn-sm btn-danger"
              (click)="openDeletePosition(item)"
            >
              Eliminar
            </button>
          }
        </ng-template>
      </app-dynamic-table>

      <app-pagination
        [pages]="positionTotalPages()"
        [currentPage]="positionPage()"
        (pageChange)="loadPositions($event)"
      />
    }
  </div>
</details>

<app-job-modal
  [isOpen]="jobModalOpen()"
  [isEdit]="isEditPosition()"
  [jobData]="editingPosition()"
  (closeModal)="closeJobModal()"
  (saveJob)="onSaveJob($event)"
/>

@if (showDeletePositionModal()) {
  <div class="modal-overlay" (click)="closeDeletePositionModal()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <h2 class="modal-title">Eliminar cargo</h2>
      <p class="text-sm text-tertiary">
        ¿Está seguro de eliminar <strong>{{ deletingPosition()?.name }}</strong
        >? Esta acción no se puede deshacer.
      </p>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeDeletePositionModal()">
          Cancelar
        </button>
        <button class="btn btn-danger" (click)="confirmDeletePosition()">
          Eliminar
        </button>
      </div>
    </div>
  </div>
}
