<div class="space-y-4">
  <div class="flex justify-end">
    <button class="btn btn-primary" (click)="openComponentModal(null)">
      + Nuevo Componente
    </button>
  </div>

  <div class="flex flex-col gap-5">
    @for (comp of components(); track comp.id) {
      <app-assessment-component
        [comp]="comp"
        (onEdit)="openComponentModal($event)"
        (onDelete)="deleteComponent($event)"
        (onSave)="onSaveComponent($event)"
      ></app-assessment-component>
    } @empty {
      <div
        class="text-center py-8 text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300"
      >
        No se han configurado componentes de evaluación para este cargo.
      </div>
    }
  </div>
</div>

<app-position-assessment-component-modal
  [positionId]="position().id"
  [selectedComponent]="selectedComponent()"
  [isOpen]="modalIsOpen()"
  (onSubmit)="onSaveComponent($event)"
  (onClose)="closeComponentModal()"
></app-position-assessment-component-modal>
