<div class="goals-dashboard-container p-6">
  <div class="dashboard-header mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Dashboard de Metas</h1>
    <p class="text-gray-600 mt-1">Resumen y gestión de las metas del sistema</p>
    <div class="flex w-full flex-row-reverse">
      <button class="btn btn-primary" (click)="openModal()">
        <i></i>
        Nueva Meta
      </button>
    </div>
  </div>
  <div
    class="table-card bg-white shadow-sm border border-gray-200 rounded-lg p-4"
  >
    <app-dynamic-table
      [data]="data()"
      [columns]="columns"
      emptyMessage="No se encontraron metas registradas."
    ></app-dynamic-table>

    <div class="mt-4">
      <app-paginator
        [pageSize]="pageSize()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (pageSizeChange)="onPageSizeChange($event)"
        (onSelectPage)="onPageChange($event)"
      ></app-paginator>
    </div>
  </div>
</div>

<app-create-goal
  [isOpen]="modalIsOpen()"
  (onClose)="closeModal()"
  (onSaved)="onGoalSaved($event)"
></app-create-goal>
