<div class="mx-auto max-w-6xl space-y-8 p-6">
  <!-- Page heading -->
  <div>
    <h1 class="text-2xl font-semibold text-gray-900">Informes</h1>
    <p class="mt-1 text-sm text-gray-500">
      Genera informes a partir de plantillas y consulta los recientes.
    </p>
  </div>

  <!-- Recent reports -->
  <section
    class="rounded-xl border border-gray-200 bg-white shadow-sm"
  >
    <div class="flex items-center gap-2 border-b border-gray-100 px-5 py-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-primary"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <h2 class="text-base font-semibold text-gray-800">Informes recientes</h2>
    </div>
    <div class="p-5">
      <app-reports-list [templateId]="null" />
    </div>
  </section>

  <!-- Templates -->
  <section
    class="rounded-xl border border-gray-200 bg-white shadow-sm"
  >
    <div class="flex items-center gap-2 border-b border-gray-100 px-5 py-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-primary"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
        />
      </svg>
      <h2 class="text-base font-semibold text-gray-800">Plantillas</h2>
    </div>
    <div class="p-5">
      <app-report-template-table />
    </div>
  </section>
</div>
