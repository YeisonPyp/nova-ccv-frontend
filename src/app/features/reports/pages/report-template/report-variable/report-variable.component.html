<div class="flex flex-col gap-4">
  <div app-loading-spinner [isLoading]="isLoading()"></div>
  @if (!isLoading()) {
    <app-dynamic-table
      [data]="elements()"
      [columns]="columns"
      emptyMessage="No hay opciones disponibles."
    >
      <ng-template #actions let-item>
        <button
          class="bg-primary hover:bg-primary text-white font-medium py-1 px-3 rounded text-sm transition-colors"
          (click)="onSelectOption.emit(item)"
        >
          Seleccionar
        </button>
      </ng-template>
    </app-dynamic-table>

    <app-paginator
      [pageSize]="size()"
      [currentPage]="page()"
      [totalPages]="pages()"
      (pageSizeChange)="size.set($event)"
      (onSelectPage)="page.set($event)"
    ></app-paginator>
  }
</div>
