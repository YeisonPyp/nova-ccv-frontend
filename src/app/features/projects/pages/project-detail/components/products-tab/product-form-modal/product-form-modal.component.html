<div class="modal-overlay" (click)="close()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <h2 class="modal-title">Nuevo producto</h2>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Código *</label>
          <input formControlName="code" class="form-control w-full" maxlength="50" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Unidad *</label>
          <input formControlName="unitMeasure" class="form-control w-full" maxlength="100" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Nombre *</label>
        <input formControlName="name" class="form-control w-full" maxlength="255" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Meta (cantidad) *</label>
        <input type="number" min="0" formControlName="targetQuantity" class="form-control w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Descripción</label>
        <textarea rows="2" formControlName="description" class="form-control w-full"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving()">
          Crear
        </button>
      </div>
    </form>
  </div>
</div>
