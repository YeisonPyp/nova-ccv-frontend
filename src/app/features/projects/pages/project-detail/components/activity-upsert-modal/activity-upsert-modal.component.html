@if (isOpen()) {
  <div class="modal-overlay" (click)="close()">
    <div
      class="modal-container"
      style="max-width: 640px"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="modal-header">
        <h2 class="modal-title">
          {{ activity() ? "Editar actividad" : "Nueva actividad" }}
        </h2>
        <button type="button" class="close-btn" (click)="close()">×</button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        @if (error()) {
          <div
            class="mb-4 px-3 py-2 rounded bg-red-50 text-red-600 text-sm border border-red-200"
          >
            {{ error() }}
          </div>
        }

        <form
          [formGroup]="form"
          id="activity-form"
          (ngSubmit)="submit()"
          class="flex flex-col gap-4"
        >
          <!-- Name -->
          <div class="form-group">
            <label>Nombre <span class="required">*</span></label>
            <input
              type="text"
              formControlName="name"
              class="form-control"
              [class.is-invalid]="isFieldInvalid('name')"
              placeholder="Nombre de la actividad"
            />
            @if (isFieldInvalid("name")) {
              <span class="invalid-feedback">Campo requerido</span>
            }
          </div>

          <!-- Description -->
          <div class="form-group">
            <label>Descripción</label>
            <textarea
              formControlName="description"
              class="form-control"
              rows="2"
              placeholder="Descripción de la actividad"
              style="resize: vertical"
            ></textarea>
          </div>

          <!-- Parent + Display order -->
          <div class="form-row">
            <div class="half-width form-group">
              <label>Actividad padre</label>
              <select formControlName="parentId" class="form-control">
                <option [ngValue]="null">— Ninguna —</option>
                @for (a of parentOptions; track a.id) {
                  <option [ngValue]="a.id">
                    {{ a.displayOrder }}. {{ a.name }}
                  </option>
                }
              </select>
            </div>

            <div class="half-width form-group">
              <label>Orden <span class="required">*</span></label>
              <input
                type="number"
                formControlName="displayOrder"
                class="form-control"
                [class.is-invalid]="isFieldInvalid('displayOrder')"
                min="1"
              />
              @if (isFieldInvalid("displayOrder")) {
                <span class="invalid-feedback">Orden requerido (mín. 1)</span>
              }
            </div>
          </div>

          <!-- Dates -->
          <div class="form-row">
            <div class="half-width form-group">
              <label>Fecha inicio</label>
              <input
                type="date"
                formControlName="starts"
                class="form-control input-date-lc"
              />
            </div>

            <div class="half-width form-group">
              <label>Fecha fin</label>
              <input
                type="date"
                formControlName="ends"
                class="form-control input-date-lc"
              />
            </div>
          </div>

          <!-- Priority + Budget -->
          <div class="form-row">
            <div class="half-width form-group">
              <label>Prioridad</label>
              <select formControlName="priority" class="form-control">
                <option value="">— Sin prioridad —</option>
                @for (r of riskOptions; track r.value) {
                  <option [value]="r.value">{{ r.label }}</option>
                }
              </select>
            </div>

            <div class="half-width form-group">
              <label>Presupuesto</label>
              <input
                type="number"
                formControlName="budgetAmount"
                class="form-control"
                min="0"
                step="0.01"
                placeholder="0.00"
              />
            </div>
          </div>
          <app-color-picker formControlName="color" />
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">
          Cancelar
        </button>
        <button
          type="submit"
          form="activity-form"
          class="btn btn-primary"
          [disabled]="submitting()"
        >
          @if (submitting()) {
            Guardando...
          } @else {
            {{ activity() ? "Guardar cambios" : "Crear actividad" }}
          }
        </button>
      </div>
    </div>
  </div>
}
