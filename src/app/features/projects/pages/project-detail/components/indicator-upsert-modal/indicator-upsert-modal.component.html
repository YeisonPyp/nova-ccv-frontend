@if (isOpen()) {
  <div class="modal-overlay" (click)="close()">
    <div
      class="modal-container"
      style="max-width: 560px"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h2 class="modal-title">
          {{ indicator() ? "Editar indicador" : "Nuevo indicador" }}
        </h2>
        <button type="button" class="close-btn" (click)="close()">×</button>
      </div>

      <div class="modal-body">
        @if (error()) {
          <div
            class="mb-4 px-3 py-2 rounded bg-red-50 text-red-600 text-sm border border-red-200"
          >
            {{ error() }}
          </div>
        }

        <form
          [formGroup]="form"
          id="indicator-form"
          (ngSubmit)="submit()"
          class="flex flex-col gap-4"
        >
          <div class="form-group">
            <label>Nombre <span class="required">*</span></label>
            <input
              type="text"
              formControlName="name"
              class="form-control"
              [class.is-invalid]="isFieldInvalid('name')"
              placeholder="Nombre del indicador"
            />
            @if (isFieldInvalid("name")) {
              <span class="invalid-feedback">Campo requerido</span>
            }
          </div>

          <div class="form-row">
            <div class="half-width form-group">
              <label>Tipo <span class="required">*</span></label>
              <select formControlName="type" class="form-control">
                @for (t of typeOptions; track t.value) {
                  <option [value]="t.value">{{ t.label }}</option>
                }
              </select>
            </div>

            <div class="half-width form-group">
              <label>Meta</label>
              <input
                type="number"
                formControlName="targetValue"
                class="form-control"
                step="0.01"
                placeholder="0.00"
              />
            </div>
          </div>

          @if (indicator()) {
            <div class="form-group">
              <label>Valor actual</label>
              <input
                type="number"
                formControlName="currentValue"
                class="form-control"
                step="0.01"
                placeholder="0.00"
              />
            </div>
          }
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">
          Cancelar
        </button>
        <button
          type="submit"
          form="indicator-form"
          class="btn btn-primary"
          [disabled]="submitting()"
        >
          @if (submitting()) {
            Guardando...
          } @else {
            {{ indicator() ? "Guardar cambios" : "Crear indicador" }}
          }
        </button>
      </div>
    </div>
  </div>
}
