<app-project-section-card
  title="Actividades"
  addLabel="+ Nueva actividad"
  (onAdd)="openCreateActivity()"
>
  <div app-loading-spinner [isLoading]="isLoading()"></div>
  @if (!isLoading()) {
    <div class="mx-4 my-4">
      @if (activities().length) {
        <div class="flex flex-row-reverse">
          <button class="btn btn-primary self-end" (click)="openGannt()">
            Ver Gannt
          </button>
        </div>
      }

      <div class="w-full">
        <div class="flex flex-col gap-4 py-4 px-4">
          @for (activity of activities(); track activity.id) {
            <app-activity-card
              [activity]="activity"
              (onEdit)="openEditActivity($event)"
            />
          } @empty {
            <span class="text-sm text-center">No hay actividades</span>
          }
        </div>
      </div>
    </div>
  }

  @if (modalGanntIsOpen()) {
    <div class="modal-overlay">
      <div class="modal-container w-full max-w-[90%]!">
        <div class="modal-header">
          <h2 class="modal-title">Gantt</h2>
          <button type="button" class="close-btn" (click)="closeGannt()">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <app-gannt-section [activities]="activities()" [risks]="[]" />
        </div>
      </div>
    </div>
  }
</app-project-section-card>

<app-activity-upsert-modal
  [isOpen]="activityModalOpen()"
  [projectId]="projectId()"
  [activity]="editingActivity()"
  [activities]="activities()"
  (onClose)="closeActivityModal()"
  (onSaved)="onActivitySaved($event)"
/>
