<app-project-section-card
  title="Actividades"
  addLabel="+ Nueva actividad"
  (onAdd)="openCreateActivity()"
>
  <div class="w-full">
    <div app-loading-spinner [isLoading]="isLoading()"></div>
    @if (!isLoading()) {
      <div class="flex flex-col gap-4 py-4 px-4">
        @for (activity of activities(); track activity.id) {
          <app-activity-card [activity]="activity" />
        }
      </div>
    }
    <app-paginator
      [pageSize]="pageSize()"
      [currentPage]="page()"
      [totalPages]="totalPages()"
      (onSelectPage)="page.set($event)"
      (pageSizeChange)="pageSize.set($event)"
    />
  </div>
</app-project-section-card>
