<div
  class="rounded-xl shadow-sm hover:shadow-md transition-shadow cursor-pointer p-5 flex flex-col gap-3"
  [style.color]="dynamicColor().foreground"
  [style.background-color]="dynamicColor().background"
  (click)="onClick()"
>
  <div class="flex flex-col gap-1">
    <span class="text-xl font-semibold">{{ activity().name }}</span>
    @if (activity().description) {
      <p class="text-xs m-0 line-clamp-2">
        {{ activity().description }}
      </p>
    }
  </div>

  <div class="flex items-center justify-between mt-1">
    <span class="text-xs">
      {{ activity().startsAt }} — {{ activity().endsAt }}
    </span>
  </div>
  <!-- budget -->
  <div>
    <span>Aprobado: {{ activity().approvedBudget }}</span>
    <span>Ejecutado: {{ activity().executedBudget }}</span>
  </div>
</div>
