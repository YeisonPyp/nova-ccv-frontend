@if (isOpen()) {
  <div class="modal-overlay" (click)="close()">
    <div
      class="modal-container"
      style="max-width: 620px"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="modal-header">
        <h2 class="modal-title">
          {{ risk() ? "Editar riesgo" : "Nuevo riesgo" }}
        </h2>
        <button type="button" class="close-btn" (click)="close()">×</button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        @if (error()) {
          <div
            class="mb-4 px-3 py-2 rounded bg-red-50 text-red-600 text-sm border border-red-200"
          >
            {{ error() }}
          </div>
        }

        <form
          [formGroup]="form"
          id="risk-form"
          (ngSubmit)="submit()"
          class="flex flex-col gap-4"
        >
          <!-- Name + Order -->
          <div class="form-row">
            <div class="form-group" style="flex: 3">
              <label>Nombre <span class="required">*</span></label>
              <input
                type="text"
                formControlName="name"
                class="form-control"
                [class.is-invalid]="isFieldInvalid('name')"
                placeholder="Nombre del riesgo"
              />
              @if (isFieldInvalid("name")) {
                <span class="invalid-feedback">Campo requerido</span>
              }
            </div>

            <div class="half-width form-group">
              <label>Orden <span class="required">*</span></label>
              <input
                type="number"
                formControlName="displayOrder"
                class="form-control"
                [class.is-invalid]="isFieldInvalid('displayOrder')"
                min="1"
              />
              @if (isFieldInvalid("displayOrder")) {
                <span class="invalid-feedback">Mín. 1</span>
              }
            </div>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label>Descripción</label>
            <textarea
              formControlName="description"
              class="form-control"
              rows="2"
              placeholder="Descripción del riesgo"
              style="resize: vertical"
            ></textarea>
          </div>

          <!-- Probability + Priority -->
          <div class="form-row">
            <div class="half-width form-group">
              <label>Probabilidad</label>
              <select formControlName="probability" class="form-control">
                @for (r of riskOptions; track r.value) {
                  <option [value]="r.value">{{ r.label }}</option>
                }
              </select>
            </div>

            <div class="half-width form-group">
              <label>Prioridad</label>
              <select formControlName="priority" class="form-control">
                @for (r of riskOptions; track r.value) {
                  <option [value]="r.value">{{ r.label }}</option>
                }
              </select>
            </div>
          </div>

          <!-- Cost + Hours -->
          <div class="form-row">
            <div class="half-width form-group">
              <label>Costo estimado</label>
              <input
                type="number"
                formControlName="estimatedCostAmount"
                class="form-control"
                min="0"
                step="0.01"
                placeholder="0.00"
              />
            </div>

            <div class="half-width form-group">
              <label>Horas estimadas</label>
              <input
                type="number"
                formControlName="estimatedHours"
                class="form-control"
                min="0"
                step="1"
                placeholder="0"
              />
            </div>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">
          Cancelar
        </button>
        <button
          type="submit"
          form="risk-form"
          class="btn btn-primary"
          [disabled]="submitting()"
        >
          @if (submitting()) {
            Guardando...
          } @else {
            {{ risk() ? "Guardar cambios" : "Crear riesgo" }}
          }
        </button>
      </div>
    </div>
  </div>
}
