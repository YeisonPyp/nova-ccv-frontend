<div class="form-group" [formGroup]="form">
  <label class="text-sm font-medium text-secondary mb-1">
    {{ row().code + " - " + row().name }}
  </label>

  <div class="flex items-center justify-between text-xs text-tertiary mb-2">
    <span>Meta: {{ row().targetQuantity }} {{ row().unitMeasure }}</span>
  </div>

  <div class="relative">
    <input
      type="number"
      min="0"
      step="0.01"
      formControlName="contribution"
      class="form-control w-full sm:text-sm text-right pr-14"
      placeholder="0"
    />
    <span
      class="absolute inset-y-0 right-3 flex items-center text-xs text-tertiary"
    >
      {{ row().unitMeasure }}
    </span>
  </div>
</div>
