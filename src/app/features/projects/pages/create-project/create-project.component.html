<div class="w-full p-6">
  <button
    class="btn btn-link text-sm text-gray-500 mb-4 ps-0"
    type="button"
    (click)="goBack()"
  >
    ← Volver a proyectos
  </button>

  <div class="flex items-center gap-3 mb-6">
    <h2 class="text-xl font-bold text-secondary m-0">Nuevo Proyecto</h2>
  </div>

  @if (error()) {
    <div
      class="mb-4 px-4 py-2.5 rounded bg-red-50 text-red-700 text-sm border border-red-200"
    >
      {{ error() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6">
    <!-- ── IDENTIFICACIÓN ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest mb-4"
      >
        Identificación
      </h5>
      <div class="grid grid-cols-4 gap-x-6 gap-y-4">
        <div class="form-group">
          <label>Código <span class="required">*</span></label>
          <input
            [appFormFieldError]="formErrors"
            type="text"
            formControlName="code"
            placeholder="PRY-2025-001"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('code')"
          />
        </div>

        <div class="col-span-2 form-group">
          <label>Nombre <span class="required">*</span></label>
          <input
            [appFormFieldError]="formErrors"
            type="text"
            formControlName="name"
            placeholder="Nombre del proyecto"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('name')"
          />
        </div>

        <div class="form-group">
          <label>Prioridad <span class="required">*</span></label>
          <select formControlName="priorityId" class="form-control">
            <option [value]="null">— Seleccionar —</option>
            @for (p of priorities(); track p.id) {
              <option [value]="p.id">{{ p.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>Estado <span class="required">*</span></label>
          <select formControlName="status" class="form-control">
            <option [value]="null">— Seleccionar —</option>
            @for (s of statuses(); track s.id) {
              <option [value]="s.name">{{ s.name }}</option>
            }
          </select>
        </div>
      </div>
    </section>

    <!-- ── PARTES ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest mb-4"
      >
        Partes del Proyecto
      </h5>
      <div class="grid grid-cols-2 gap-x-6 gap-y-4">
        <app-context-search-select
          [ctx]="areaCtx"
          label="Área"
          [required]="true"
        />

        <app-context-search-select
          [ctx]="employeeCtx"
          label="Empleado responsable"
          [required]="true"
        />

        <app-context-search-select
          [ctx]="costCenterCtx"
          label="Centro de costo"
          [required]="false"
        />

        <div class="form-group">
          <label>Presupuesto total</label>
          <input
            type="number"
            formControlName="totalBudget"
            class="form-control"
            min="0"
            step="0.01"
            placeholder="0.00"
          />
        </div>
      </div>
    </section>

    <!-- ── PLANIFICACIÓN ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest mb-4"
      >
        Planificación
      </h5>
      <div class="grid grid-cols-2 gap-x-6 gap-y-4">
        <div class="form-group">
          <label>Fecha de inicio <span class="required">*</span></label>
          <input
            [appFormFieldError]="formErrors"
            type="date"
            formControlName="starts"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('starts')"
          />
        </div>

        <div class="form-group">
          <label>Fecha de fin <span class="required">*</span></label>
          <input
            [appFormFieldError]="formErrors"
            type="date"
            formControlName="ends"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('ends')"
          />
        </div>
      </div>
    </section>

    <!-- ── DESCRIPCIÓN ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h5
        class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest mb-4"
      >
        Descripción
      </h5>
      <div class="grid grid-cols-2 gap-x-6 gap-y-4">
        <div class="form-group">
          <label>Objetivo general <span class="required">*</span></label>
          <textarea
            formControlName="generalObjective"
            rows="4"
            placeholder="Descripción del objetivo general del proyecto..."
            class="form-control"
            style="resize: none"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea
            formControlName="description"
            rows="4"
            placeholder="Descripción general del proyecto..."
            class="form-control"
            style="resize: none"
          ></textarea>
        </div>
      </div>
    </section>

    <!-- ── OBJETIVOS ESPECÍFICOS ── -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <div class="flex items-center justify-between mb-4">
        <h5
          class="text-[0.65rem] font-semibold text-gray-400 uppercase tracking-widest m-0"
        >
          Objetivos específicos
        </h5>
        <button
          type="button"
          class="btn btn-secondary text-xs"
          (click)="addObjective()"
        >
          + Agregar objetivo
        </button>
      </div>

      @if (objectives.length === 0) {
        <p class="text-sm text-gray-400 text-center py-4">
          Sin objetivos específicos. Use el botón para agregar.
        </p>
      }

      <div class="flex flex-col gap-3" formArrayName="objectives">
        @for (obj of objectives.controls; track $index; let i = $index) {
          <div
            [formGroupName]="i"
            class="relative grid grid-cols-2 gap-x-4 gap-y-2 p-4 rounded-lg border border-gray-100 bg-gray-50"
          >
            <button
              type="button"
              class="absolute top-2 right-2 w-6 h-6 flex items-center justify-center text-gray-400 hover:text-red-500 rounded cursor-pointer bg-transparent border-none text-lg leading-none"
              (click)="removeObjective(i)"
            >
              ×
            </button>

            <div class="form-group">
              <label>Nombre <span class="required">*</span></label>
              <input
                type="text"
                formControlName="name"
                placeholder="Nombre del objetivo"
                class="form-control"
              />
            </div>

            <div class="form-group">
              <label>Descripción <span class="required">*</span></label>
              <input
                type="text"
                formControlName="description"
                placeholder="Descripción del objetivo"
                class="form-control"
              />
            </div>
          </div>
        }
      </div>
    </section>

    <!-- ── FOOTER ── -->
    <div class="flex justify-end gap-3 pb-8">
      <button type="button" class="btn btn-secondary" (click)="goBack()">
        Cancelar
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="submitting()"
      >
        @if (submitting()) {
          Creando...
        } @else {
          Crear Proyecto
        }
      </button>
    </div>
  </form>
</div>
