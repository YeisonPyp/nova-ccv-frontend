<div class="space-y-4">
  <div class="border rounded-lg p-4 bg-gray-50 flex flex-wrap items-end gap-3">
    <div class="flex-1 min-w-64">
      <app-search-select
        label="Agregar empleado"
        placeholder="Buscar empleado…"
        [items]="employeeContext.options()"
        [selectedItems]="employeeContext.selectedOptions()"
        (onSearch)="searchEmployee($event)"
        (onSelect)="selectEmployee($event)"
        (onRemove)="removeSelected($event)"
      />
    </div>
    <button
      class="btn btn-sm btn-primary"
      [disabled]="!selectedEmployeeId()"
      (click)="add()"
    >
      + Agregar
    </button>
  </div>

  @if (employees().length) {
    <div class="flex flex-wrap gap-2">
      @for (e of employees(); track e.id) {
        <app-chip-item [op]="chipOf(e)" (onRemove)="remove(e)" />
      }
    </div>
  } @else {
    <p class="text-sm text-gray-500 italic py-4">
      No hay empleados en el programa.
    </p>
  }
</div>
