<div class="p-6 flex flex-col gap-6">
  <!-- Welcome + year scope -->
  <section class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-secondary m-0">
        {{ greeting }}, {{ getUserName() }}! 👋
      </h1>
      <p class="text-sm text-tertiary m-0">
        Plan Anual de Trabajo — {{ currentDate | date: "EEEE, d MMMM yyyy" }}
      </p>
    </div>

    <div class="flex items-center gap-2">
      <label
        for="home-year"
        class="text-xs font-semibold text-gray-500 uppercase tracking-wide"
      >
        Año
      </label>
      <input
        id="home-year"
        type="number"
        min="2000"
        max="2100"
        step="1"
        class="text-sm rounded border border-gray-200 px-3 py-1.5 bg-white w-24 focus:outline-none focus:ring-1 focus:ring-primary"
        [value]="year()"
        (change)="onYearChange($event)"
      />
    </div>
  </section>

  <app-pat-home-dashboard [year]="year()" />
</div>
