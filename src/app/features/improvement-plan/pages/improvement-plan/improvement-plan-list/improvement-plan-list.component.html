<div class="w-full">
  <div class="flex justify-between mb-3">
    <h1 class="text-2xl font-bold">Planes de Mejoramiento</h1>
    <button
      *appHasPermission="['IMPROVEMENT_PLAN_CREATE']"
      class="btn btn-primary"
      (click)="openPlan()"
    >
      Nuevo Plan
    </button>
  </div>

  <app-improvement-plan-metrics-cards></app-improvement-plan-metrics-cards>

  @if (loading()) {
    <div class="text-center py-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  } @else {
    <div class="card shadow-sm">
      <div class="card-body">
        <app-dynamic-table
          [data]="plans()"
          [columns]="columns"
          emptyMessage="No se encontraron planes de mejora."
        >
          <ng-template #actions let-item>
            <button
              *ngIf="isAdmin()"
              class="btn btn-sm btn-outline-primary me-2"
              (click)="openPlan(item)"
              title="Editar"
            >
              <i class="bi">✏️</i>
            </button>
            <button
              *ngIf="isAdmin()"
              class="btn btn-sm btn-outline-danger"
              (click)="deletePlan(item)"
              title="Eliminar"
            >
              <i class="bi">🗑️</i>
            </button>
          </ng-template>
        </app-dynamic-table>

        <app-paginator
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          [pageSize]="pageSize()"
          (onSelectPage)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
        ></app-paginator>
      </div>
    </div>
  }
</div>
