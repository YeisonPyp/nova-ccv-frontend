<details
  class="group/item border border-gray-200 rounded-lg overflow-hidden shadow-sm"
  [formGroup]="formGroup"
>
  <summary
    class="flex items-center justify-between p-3 cursor-pointer list-none bg-white hover:bg-gray-50 transition-colors"
  >
    <div class="flex items-center gap-2 grow mr-4">
      <svg
        class="w-4 h-4 text-gray-400 transition-transform group-open/item:rotate-90"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5l7 7-7 7"
        />
      </svg>

      <input
        type="text"
        [value]="action().name"
        class="grow bg-transparent font-medium text-gray-700 outline-none border-b border-transparent focus:border-blue-400 focus:placeholder:text-transparent transition-all px-1"
        placeholder="Nombre de la acción..."
        (click)="$event.stopPropagation()"
        formControlName="name"
      />
    </div>

    <div class="flex items-center gap-6">
      <div class="hidden sm:flex items-center gap-3">
        <div
          class="w-20 h-1.5 bg-gray-100 rounded-full overflow-hidden border border-gray-200"
        >
          <div
            class="h-full bg-blue-500 rounded-full transition-all duration-500"
            [style.width.%]="action().progress"
          ></div>
        </div>
        <div class="flex items-center text-[10px] font-bold text-gray-400">
          <input
            type="number"
            [value]="action().progress"
            class="w-8 bg-transparent text-right outline-none focus:text-blue-600"
            (click)="$event.stopPropagation()"
          />
          <span>%</span>
        </div>
      </div>

      <select
        [value]="action().status"
        class="px-2 py-0.5 text-xs font-bold rounded uppercase tracking-wider bg-amber-50 text-amber-700 border border-amber-200 outline-none focus:ring-2 focus:ring-amber-400/20 cursor-pointer"
        (click)="$event.stopPropagation()"
        formControlName="status"
      >
        <option value="PENDING">PENDIENTE</option>
        <option value="IN_PROGRESS">EN PROCESO</option>
        <option value="COMPLETED">COMPLETADO</option>
      </select>
      <button
        type="button"
        class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-all duration-200 opacity-0 group-hover:opacity-100 focus:opacity-100"
        title="Eliminar acción"
        (click)="onDeleteCorrectiveAction()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </summary>

  <div class="p-5 bg-white border-t border-gray-100 space-y-6">
    <div class="space-y-2">
      <label
        class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"
        >Descripción de la acción</label
      >
      <textarea
        rows="2"
        class="w-full text-sm text-gray-600 leading-relaxed outline-none border-l-2 border-gray-100 focus:border-blue-400 pl-4 bg-transparent resize-none transition-all"
        placeholder="Añade una descripción detallada..."
        formControlName="description"
        >{{ action().description }}</textarea
      >
    </div>

    <div>
      <h3
        class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-3"
      >
        Evidencias
      </h3>
      <div
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"
      >
        @for (ev of evidences(); track ev.id) {
          <app-evidence-item
            [actionId]="action().id"
            [evidence]="ev"
            
            (onSaved)="onSaveEvidence($event)"
            (onRemoved)="onRemoveEvidence($event)"
          ></app-evidence-item>
        }
        <app-evidence-item
          [actionId]="action().id"

          (onSaved)="onSaveEvidence($event)"
        ></app-evidence-item>
      </div>
    </div>

    <div class="pt-4 border-t border-gray-50">
      <app-corrective-action-section
        [parentId]="action().id"
        [planId]="planId()"
      ></app-corrective-action-section>
    </div>
  </div>
</details>
