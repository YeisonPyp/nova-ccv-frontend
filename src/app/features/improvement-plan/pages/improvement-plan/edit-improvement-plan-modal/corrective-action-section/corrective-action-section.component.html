<section class="p-4">
  <details class="group" (toggle)="onToggle($event)">
    <summary
      class="text-sm font-bold text-gray-500 uppercase tracking-wider cursor-pointer list-none mb-4 hover:text-gray-700 transition-colors">
      Acciones correctivas
    </summary>

    <div class="space-y-2">
      @if(childActions() > 0) {
        @for (action of actions(); track action.id) {
          <details class="border border-gray-200 rounded-lg overflow-hidden shadow-sm">
            <summary
              class="flex items-center justify-between p-3 cursor-pointer list-none bg-white hover:bg-gray-50 transition-colors">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-400 transition-transform group-open/item:rotate-90" fill="none"
                  viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
                <span class="font-medium text-gray-700">{{ action.name }}</span>
              </div>
    
              <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-2">
                  <div class="w-24 h-1.5 bg-gray-100 rounded-full overflow-hidden border border-gray-200">
                    <div class="h-full bg-blue-500 rounded-full transition-all duration-500" [style.width.%]="action.progress"></div>
                  </div>
                  <span class="text-[10px] font-bold text-gray-400 w-7 text-right">{{action.progress}}%</span>
                </div>
    
                <span
                  class="px-2 py-0.5 text-xs font-bold rounded uppercase tracking-wider bg-amber-100 text-amber-700 border border-amber-200">
                  {{ action.status }}
                </span>
              </div>
            </summary>
    
            <div class="p-4 bg-white border-t border-gray-100">
              <p class="text-sm text-gray-600 leading-relaxed mb-6">
                {{ action.description }}
              </p>
    
              <div class="mt-4">
                <h3 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-3">
                  Evidencias
                </h3>
    
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                  @for (ev of action.evidences; track ev.id) {
                    <app-evidence-item></app-evidence-item>
                  }
                  <app-evidence-item [isNew]="true"></app-evidence-item>
                </div>
              </div>
    
              @if (action.childLength > 0) {
                <div class="mt-6">
                  <app-corrective-action-section [parentId]="action.id"></app-corrective-action-section>
                </div>
              }
            </div>
          </details>
        }
      }
    </div>

    <div
      class="group flex items-center min-h-8 py-2 px-2 mt-2 rounded-md hover:bg-gray-50 transition-all cursor-pointer border-b border-transparent hover:border-gray-100">
      <div class="shrink-0 flex items-center justify-center w-5 h-5 mr-2 text-gray-400 group-hover:text-blue-500">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>

      <div contenteditable="true"
        class="grow text-sm text-gray-400 outline-none focus:text-gray-800 empty:before:content-['Agregar_elemento'] before:text-gray-400"
        data-placeholder="Agregar elemento"></div>

      <div class="flex items-center space-x-2 opacity-0 group-hover:opacity-100 transition-opacity">
        <button class="text-gray-400 hover:text-gray-600">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
          </svg>
        </button>
        <button class="text-gray-400 hover:text-gray-600">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
        </button>
      </div>
    </div>
  </details>
</section>
