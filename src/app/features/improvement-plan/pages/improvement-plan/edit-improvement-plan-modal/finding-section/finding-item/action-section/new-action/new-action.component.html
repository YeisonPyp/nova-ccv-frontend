<div
  class="mt-3 p-5 rounded-2xl border border-gray-200/60 bg-gray-50/80 shadow-sm space-y-5"
  [formGroup]="form"
>
  <div class="flex items-center gap-2">
    <svg
      class="w-3.5 h-3.5 text-primary"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2.5"
        d="M12 4v16m8-8H4"
      />
    </svg>
    <span
      class="text-[11px] font-bold text-tertiary uppercase tracking-[0.15em]"
    >
      Nueva acción de mejora
    </span>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-2">
      <label
        class="text-[10px] font-bold uppercase tracking-[0.15em] flex items-center gap-1.5"
      >
        <svg
          class="w-3 h-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        Descripción del objetivo
      </label>
      <textarea
        rows="3"
        class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-[13px] text-secondary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-primary transition-all resize-none"
        placeholder="¿Qué se busca lograr?"
        formControlName="objectiveDescription"
      ></textarea>
    </div>

    <div class="flex flex-col gap-2">
      <label
        class="text-[10px] font-bold uppercase tracking-[0.15em] flex items-center gap-1.5"
      >
        <svg
          class="w-3 h-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
          />
        </svg>
        Acción de mejora
      </label>
      <textarea
        rows="3"
        class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-[13px] text-secondary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-primary transition-all resize-none"
        placeholder="¿Qué se va a hacer?"
        formControlName="actionDescription"
      ></textarea>
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <label class="text-[10px] font-bold uppercase tracking-[0.15em]">
      Ciclo PHVA
    </label>
    <div class="flex flex-wrap gap-2">
      @for (phase of pdcaPhases; track phase) {
        <button
          type="button"
          class="px-3 py-1.5 text-[11px] font-bold rounded-full border transition-all"
          [class]="
            isPhaseSelected(phase)
              ? 'bg-primary text-white border-primary shadow-sm'
              : 'bg-white text-tertiary border-gray-200 hover:border-blue-300'
          "
          (click)="togglePhase(phase)"
        >
          {{ getPdcaPhaseLabel(phase) }}
        </button>
      }
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="flex flex-col gap-2">
      <label
        class="text-[10px] font-bold uppercase tracking-[0.15em] flex items-center gap-1.5"
      >
        <svg
          class="w-3 h-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        Ejecución
      </label>
      <select
        class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold text-primary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-primary transition-all appearance-none cursor-pointer"
        app-selector
        [options]="executionFrequencies"
        formControlName="executionFrequency"
      ></select>
    </div>

    <div class="flex flex-col gap-2">
      <label
        class="text-[10px] font-bold uppercase tracking-[0.15em] flex items-center gap-1.5"
      >
        <svg
          class="w-3 h-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          />
        </svg>
        Vigencia
      </label>
      <div
        class="flex items-center justify-between bg-white border border-gray-200 rounded-xl px-2 py-1.5 shadow-sm"
      >
        <input
          type="date"
          class="bg-transparent text-[13px] font-semibold text-secondary outline-none w-full cursor-pointer"
          formControlName="startDate"
        />
        <svg
          viewBox="0 0 20 20"
          class="w-6 h-4 fill-current text-tertiary shrink-0"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M11.5 3.5l5.5 5.5-5.5 5.5-1.4-1.2 3.2-3.1H0V8.2h13.3l-3.2-3.1L11.5 3.5z"
            fill-rule="evenodd"
          />
        </svg>
        <input
          type="date"
          class="bg-transparent text-[13px] font-semibold text-secondary outline-none w-full cursor-pointer text-right"
          formControlName="closeDate"
        />
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <label class="text-[10px] font-bold uppercase tracking-[0.15em]">
      Indicador
    </label>
    <input
      type="text"
      class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-[13px] font-medium text-secondary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-primary transition-all"
      placeholder="Indicador de seguimiento..."
      formControlName="indicator"
    />
  </div>

  <div class="flex flex-col gap-2 max-w-xs">
    <label
      class="text-[10px] font-bold uppercase tracking-[0.15em] flex items-center gap-1.5"
    >
      <svg
        class="w-3 h-3"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.5"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>
      Responsable
    </label>
    <app-select-search
      placeholder="Responsable..."
      [emptyMessage]="searchSelectEmployeeContext.op?.emptyMessage ?? ''"
      [items]="searchSelectEmployeeContext.options()"
      [selectedItems]="searchSelectEmployeeContext.selectedOptions()"
      [maxElements]="searchSelectEmployeeContext.op?.maxItems ?? 1"
      [required]="searchSelectEmployeeContext.op?.isRequired ?? false"
      (onRemove)="searchSelectEmployeeContext.remove($event)"
      (onSearch)="searchSelectEmployeeContext.search($event)"
      (onSelect)="searchSelectEmployeeContext.select($event)"
    ></app-select-search>
  </div>

  <div class="flex justify-end pt-1">
    <button
      type="button"
      class="px-4 py-2 bg-primary text-white text-xs font-bold rounded-lg shadow-sm hover:bg-primary transition-all disabled:opacity-50"
      [disabled]="!form.valid || selectedPhases.size === 0"
      (click)="onSubmit()"
    >
      Agregar acción de mejora
    </button>
  </div>
</div>
