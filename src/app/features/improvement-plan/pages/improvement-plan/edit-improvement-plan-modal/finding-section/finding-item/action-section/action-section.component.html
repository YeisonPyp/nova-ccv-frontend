<section class="p-4">
  <div class="group">
    <span
      class="text-sm font-bold text-tertiary uppercase tracking-wider cursor-pointer mb-4 hover:text-secondary transition-colors"
    >
      Acciones de mejora
    </span>

    <div class="space-y-2">
      @for (action of $actions(); track action.id) {
        <app-action-details
          [action]="action"
          [findingType]="findingType()"
          (onDelete)="onDeleteAction($event)"
          (onUpdated)="onActionUpdated($event)"
        ></app-action-details>
      }
    </div>

    <app-new-action
      [findingId]="findingId()"
      [findingType]="findingType()"
      (onCreated)="onCreated($event)"
    ></app-new-action>
  </div>
</section>
