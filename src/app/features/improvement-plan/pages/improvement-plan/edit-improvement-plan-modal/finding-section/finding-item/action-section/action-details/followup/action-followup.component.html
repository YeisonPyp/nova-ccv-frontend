<div
  class="rounded-xl border border-gray-200/60 bg-white shadow-sm p-4 flex flex-col gap-4"
  [formGroup]="form"
>
  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <svg
        class="w-3.5 h-3.5 text-tertiary shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      <input
        type="date"
        class="bg-transparent text-[13px] font-semibold text-secondary outline-none border-b border-transparent focus:border-blue-500 disabled:cursor-not-allowed"
        formControlName="scheduledDate"
      />
    </div>

    <span
      class="px-2 py-1 text-[10px] font-bold rounded-md uppercase tracking-tight border"
      [class]="statusBadgeClass()"
    >
      {{ statusLabel() }}
    </span>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-2">
      <label class="text-[10px] font-bold uppercase tracking-[0.15em]">
        Estado
      </label>
      <select
        app-selector
        formControlName="status"
        [options]="statusOptions"
        class="w-full bg-gray-50/60 border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold text-secondary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-primary transition-all appearance-none cursor-pointer disabled:cursor-not-allowed disabled:opacity-60"
      ></select>
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-[10px] font-bold uppercase tracking-[0.15em]">
        Observaciones
      </label>
      <textarea
        rows="1"
        formControlName="observations"
        placeholder="Observaciones del seguimiento..."
        class="w-full bg-gray-50/60 border border-gray-200 rounded-xl px-3 py-2 text-[13px] text-secondary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-primary transition-all resize-none disabled:cursor-not-allowed disabled:opacity-60"
      ></textarea>
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <label class="text-[10px] font-bold uppercase tracking-[0.15em]">
        Evidencias
      </label>
      <span class="text-[10px] bg-gray-100 px-2 py-0.5 rounded-full">
        {{ evidences().length }}
      </span>
    </div>

    <div class="flex flex-wrap gap-3">
      @for (evidence of evidences(); track evidence.id) {
        <app-evidence-item
          [evidence]="evidence"
          [followUpId]="followup().id"
          (onSaved)="onSaveEvidence($event)"
          (onRemoved)="onRemoveEvidence($event)"
        ></app-evidence-item>
      }

      @if (canUploadEvidence()) {
        <app-evidence-item
          [followUpId]="followup().id"
          (onSaved)="onSaveEvidence($event)"
          (onRemoved)="onRemoveEvidence($event)"
        ></app-evidence-item>
      }
    </div>
  </div>
</div>
