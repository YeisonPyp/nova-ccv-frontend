<div class="relative w-48 h-40 group">
  @if (isNew()) {
    <button
      (click)="fileInput.click()"
      [disabled]="loading()"
      class="flex flex-col items-center justify-center w-full h-full border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 hover:bg-gray-100 hover:border-blue-400 transition-all group/btn"
    >
      <div
        class="p-3 rounded-full bg-white shadow-sm border border-gray-100 group-hover/btn:scale-110 transition-transform"
      >
        @if (loading()) {
          <span
            class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin block"
          ></span>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6 text-gray-400 group-hover/btn:text-blue-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
        }
      </div>
      <span
        class="mt-2 text-xs font-medium text-gray-500 group-hover/btn:text-blue-600"
        >Añadir evidencia</span
      >

      <input
        type="file"
        #fileInput
        class="hidden"
        (change)="onFileSelected($event);"
        accept="image/*,.pdf"
      />
    </button>
  } @else {
    <div
      class="flex flex-col w-full h-full bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow"
    >
      <div
        class="relative grow flex items-center justify-center bg-gray-100 overflow-hidden"
      >
        @if (resourceUrl() && evidence()?.type?.includes('image')) {
          <img
            [src]="resourceUrl()"
            class="w-full h-full object-cover"
            alt="Preview"
          />
        } @else {
          <div class="flex flex-col items-center">
            <svg
              class="w-12 h-12 text-red-500"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"
              />
            </svg>
            <span class="text-[10px] font-bold text-red-600 mt-1 uppercase"
              >{{evidence()?.type ?? 'DOC'}}</span
            >
          </div>
        }

        <div
          class="absolute inset-0 bg-gray-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2"
        >
          <button
            (click)="viewEvidence()"
            class="p-2 bg-white/20 hover:bg-white/40 rounded-full text-white backdrop-blur-md"
            title="Ver"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
            </svg>
          </button>
          <button
            (click)="deleteEvidence()"
            class="p-2 bg-red-500/80 hover:bg-red-600 rounded-full text-white backdrop-blur-md"
            title="Eliminar"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="p-2 border-t border-gray-100">
        <p
          class="text-[11px] font-semibold text-gray-700 truncate"
          [title]="evidence()?.description"
        >
          {{ evidence()?.description || "Evidencia adjunta" }}
        </p>
        <div class="flex justify-between items-center mt-1">
          <span class="text-[9px] text-gray-400">{{evidence()?.createdAt}}</span>
          <div
            class="w-4 h-4 bg-blue-500 rounded-full flex items-center justify-center text-[8px] text-white font-bold"
          >
            SL
          </div>
        </div>
      </div>
    </div>
  }
</div>
