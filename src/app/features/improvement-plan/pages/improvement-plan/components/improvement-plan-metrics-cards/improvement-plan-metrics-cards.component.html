<div class="flex flex-wrap gap-4 mb-6">
  <div class="metric-card">
    <span class="metric-label">Planes Activos</span>
    <span class="metric-value">{{ activePlans() }}</span>
  </div>
  <div class="metric-card">
    <span class="metric-label">Acciones Totales</span>
    <span class="metric-value">{{ totalActions() }}</span>
  </div>
  <div class="metric-card">
    <span class="metric-label">Completadas</span>
    <span class="metric-value success">{{ completedActions() }}</span>
  </div>
  <div class="metric-card">
    <span class="metric-label">Cumplimiento</span>
    <span class="metric-value">{{ completionRate() }}%</span>
  </div>
</div>
