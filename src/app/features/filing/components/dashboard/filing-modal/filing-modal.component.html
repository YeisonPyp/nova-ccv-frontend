@if (isOpen()) {
  <div class="modal-overlay flex flex-col max-h-screen min-h-[99%]" [formGroup]="form">
    <div
      class="modal-container max-w-3xl! scrollable-container max-h-screen min-h-full"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="modal-header">
        @if (isUpdateMode()) {
          <h2 class="text-xl font-bold text-secondary tracking-tight">
            Radicado #{{ filing()?.id }}
          </h2>
        } @else {
          <select
            formControlName="processName"
            class="text-xl font-bold text-secondary tracking-tight bg-transparent border-none outline-none cursor-pointer appearance-none"
          >
            <option [value]="null" disabled selected>Seleccionar proceso...</option>
            @for (p of processes(); track p.id) {
              <option [value]="p.name">{{ p.name }}</option>
            }
          </select>
        }
        <button
          class="p-2 text-alternate hover:text-tertiary hover:bg-gray-100 rounded-full transition-all"
          (click)="close()"
        >
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="grow overflow-y-auto p-6 space-y-6 bg-white">
        <section
          class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50/80 p-6 rounded-2xl border border-gray-200/60 shadow-sm"
        >
          <!-- Process select (update mode — create mode uses header) -->
          @if (isUpdateMode()) {
            <div class="flex flex-col gap-2">
              <label class="text-[10px] font-bold text-alternate uppercase tracking-[0.15em]">
                Proceso
              </label>
              <select
                formControlName="processName"
                class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold text-primary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none cursor-pointer"
              >
                <option [value]="null">Sin proceso</option>
                @for (p of processes(); track p.id) {
                  <option [value]="p.name">{{ p.name }}</option>
                }
              </select>
            </div>
          }

          <!-- Area -->
          <div class="flex flex-col gap-2">
            <label class="text-[10px] font-bold text-alternate uppercase tracking-[0.15em]">
              Área
            </label>
            <app-search-select
              class="w-full"
              [emptyMessage]="searchSelectAreaContext.op?.emptyMessage ?? 'Sin resultados'"
              [items]="searchSelectAreaContext.options()"
              [selectedItems]="searchSelectAreaContext.selectedOptions()"
              [maxElements]="searchSelectAreaContext.op?.maxItems ?? 1"
              [required]="searchSelectAreaContext.op?.isRequired ?? false"
              (onRemove)="searchSelectAreaContext.remove($event)"
              (onSearch)="searchSelectAreaContext.search($event)"
              (onSelect)="searchSelectAreaContext.select($event)"
            />
          </div>

          <!-- Origin -->
          <div class="flex flex-col gap-2">
            <label class="text-[10px] font-bold text-alternate uppercase tracking-[0.15em]">
              Origen
            </label>
            <input
              type="text"
              formControlName="origin"
              placeholder="Origen del radicado..."
              class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold text-secondary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
            />
          </div>

          <!-- Destination -->
          <div class="flex flex-col gap-2">
            <label class="text-[10px] font-bold text-alternate uppercase tracking-[0.15em]">
              Destino
            </label>
            <input
              type="text"
              formControlName="destination"
              placeholder="Destino del radicado..."
              class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold text-secondary shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
            />
          </div>
        </section>

        <!-- Files section (update mode) -->
        @if (isUpdateMode()) {
          <details class="border border-gray-200 rounded-xl overflow-hidden">
            <summary
              class="px-4 py-3 bg-gray-50 cursor-pointer font-semibold text-sm text-secondary flex items-center gap-2 select-none list-none"
            >
              <svg
                class="w-4 h-4 text-tertiary"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"
                />
              </svg>
              Archivos
              <span class="ml-auto text-xs text-tertiary font-normal">
                {{ files().length }} archivo(s)
              </span>
            </summary>
            <div class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-3">
              @for (file of files(); track file.id) {
                <app-filing-file-item
                  [filingFile]="file"
                  [filingId]="filing()!.id"
                  (saved)="onFileSaved($event)"
                  (removed)="onFileRemoved($event)"
                />
              }
              <app-filing-file-item
                [filingFile]="null"
                [filingId]="filing()!.id"
                (saved)="onFileSaved($event)"
              />
            </div>
          </details>
        }
      </div>

      <!-- Footer (create mode only) -->
      @if (!isUpdateMode()) {
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-3">
          <button
            class="px-4 py-2 text-sm font-semibold text-tertiary hover:text-secondary transition-colors"
            (click)="close()"
          >
            Cerrar
          </button>
          <button
            class="px-4 py-2 bg-primary text-white text-sm font-bold rounded-lg shadow-sm hover:bg-primary transition-all disabled:opacity-50"
            (click)="onSubmit()"
            [disabled]="form.invalid || saving()"
          >
            {{ saving() ? "Creando..." : "Crear radicado" }}
          </button>
        </div>
      }
    </div>
  </div>
}
