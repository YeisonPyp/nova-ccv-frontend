<div class="w-full">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-1">Radicados</h2>

      <!-- Breadcrumb -->
      <nav class="d-flex align-items-center gap-1" style="font-size: 0.85rem">
        @for (
          crumb of breadcrumb();
          track crumb.id;
          let i = $index;
          let last = $last
        ) {
          @if (!last) {
            <button
              class="btn btn-link p-0"
              style="font-size: 0.85rem"
              (click)="navigateTo(i)"
            >
              {{ crumb.label }}
            </button>
            <span class="text-muted">/</span>
          } @else {
            <span class="fw-semibold">{{ crumb.label }}</span>
          }
        }
      </nav>
    </div>
    <button class="btn btn-primary" (click)="openCreateModal()">
      + Nuevo radicado
    </button>
  </div>

  <!-- Table -->
  @if (loading()) {
    <div class="text-center py-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  } @else {
    <app-dynamic-table
      [data]="items()"
      [columns]="columns"
      emptyMessage="No hay radicados en este nivel."
    >
      <ng-template #actions let-item>
        <button
          class="btn btn-sm btn-outline-primary me-2"
          title="Editar"
          (click)="openEditModal(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
            />
          </svg>
        </button>
        <button
          class="btn btn-sm btn-outline-secondary me-2"
          title="Ver hijos"
          (click)="drillDown(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>
        <button
          class="btn btn-sm btn-outline-danger"
          title="Eliminar"
          (click)="deleteItem(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </button>
      </ng-template>
    </app-dynamic-table>

    <app-pagination
      [currentPage]="currentPage()"
      [pages]="totalPages()"
      (pageChange)="onPageChange($event)"
    />
  }
</div>

<!-- Modal -->
<app-filing-modal
  [isOpen]="isCreateModalOpen()"
  [filing]="selectedFiling()"
  [parentId]="currentParentId()"
  (onClose)="closeModal()"
  (onSaved)="onFilingSaved()"
  (onUpdated)="onFilingUpdated($event)"
/>
