<div
  class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden"
>
  <!-- Card header -->
  <div
    class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-gray-50"
  >
    <div class="flex items-center gap-3">
      <span
        class="w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center"
      >
        <svg
          class="w-4 h-4 text-primary"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        </svg>
      </span>
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
          Radicado
        </p>
        <p class="text-base font-bold text-secondary">#{{ filing().id }}</p>
      </div>
    </div>
    <button
      (click)="navigate()"
      class="px-4 py-2 text-sm font-semibold text-primary border border-primary rounded-lg hover:bg-blue-50 transition-colors"
    >
      Ver detalle →
    </button>
  </div>

  <!-- Info grid -->
  <div
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-5 px-6 py-5"
  >
    <div class="flex flex-col gap-1">
      <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider"
        >Proceso</span
      >
      <span class="text-sm font-medium text-secondary">{{
        filing().processName ?? "—"
      }}</span>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider"
        >Área</span
      >
      <span class="text-sm font-medium text-secondary">{{
        filing().areaName ?? "—"
      }}</span>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider"
        >Fecha de creación</span
      >
      <span class="text-sm font-medium text-secondary">{{
        filing().createdAt | date: "dd/MM/yyyy HH:mm"
      }}</span>
    </div>

    @if (filing().parentId) {
      <div class="flex flex-col gap-1">
        <span
          class="text-xs font-semibold text-gray-400 uppercase tracking-wider"
          >Radicado padre</span
        >
        <span class="text-sm font-medium text-secondary"
          >#{{ filing().parentId }}</span
        >
      </div>
    }
  </div>
</div>
