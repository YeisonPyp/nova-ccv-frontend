<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
  <h3 class="text-base font-semibold text-secondary mb-4">Datos del Otro Sí</h3>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="form-group">
        <label for="index">Índice <span class="text-red-500">*</span></label>
        <input
          id="index"
          type="number"
          formControlName="index"
          class="form-control"
          min="1"
        />
      </div>
      <div class="form-group">
        <label for="executionDate">Fecha de ejecución</label>
        <input
          id="executionDate"
          type="date"
          formControlName="executionDate"
          class="form-control"
        />
      </div>
      <div class="form-group md:col-span-2">
        <label for="othersiDesc"
          >Descripción <span class="text-red-500">*</span></label
        >
        <textarea
          id="othersiDesc"
          formControlName="description"
          class="form-control"
          rows="4"
        ></textarea>
      </div>
    </div>
    <div class="flex justify-end mt-6">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || saving()"
      >
        {{ saving() ? "Guardando..." : "Guardar Otro Sí" }}
      </button>
    </div>
  </form>
</div>
