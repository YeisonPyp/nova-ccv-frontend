<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
  <h3 class="text-base font-semibold text-secondary mb-4">
    Datos de la adición
  </h3>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="form-group">
        <label for="newBasePeriodAmount"
          >Nuevo monto base período <span class="text-red-500">*</span></label
        >
        <input
          id="newBasePeriodAmount"
          type="number"
          formControlName="newBasePeriodAmount"
          class="form-control"
          min="0"
          step="0.01"
        />
      </div>
      <div class="form-group md:col-span-2">
        <label for="addDesc">Descripción</label>
        <textarea
          id="addDesc"
          formControlName="description"
          class="form-control"
          rows="3"
        ></textarea>
      </div>
    </div>
    <div class="flex justify-end mt-6">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || saving()"
      >
        {{ saving() ? "Guardando..." : "Guardar adición" }}
      </button>
    </div>
  </form>
</div>
