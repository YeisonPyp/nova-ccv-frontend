<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
  <h3 class="text-base font-semibold text-secondary mb-4">
    Mutaciones del contrato
  </h3>

  @if (loading()) {
    <p class="text-sm text-gray-400">Cargando mutaciones...</p>
  } @else if (mutations().length === 0) {
    <p class="text-sm text-gray-400 italic">Sin mutaciones registradas aún.</p>
  } @else {
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr
            class="border-b border-gray-200 text-xs text-gray-400 uppercase text-left"
          >
            <th class="pb-2 pr-4">ID</th>
            <th class="pb-2 pr-4">Operación</th>
            <th class="pb-2 pr-4">Creado</th>
          </tr>
        </thead>
        <tbody>
          @for (m of mutations(); track m.id) {
            <tr class="border-b border-gray-100 last:border-0">
              <td class="py-2 pr-4 text-gray-600">{{ m.id }}</td>
              <td class="py-2 pr-4 text-secondary font-medium">
                {{ m.opName }}
              </td>
              <td class="py-2 pr-4 text-gray-500">
                {{ m.createdAt | date: "dd/MM/yyyy" }}
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }

  <div class="flex justify-end mt-6">
    <button class="btn btn-primary" (click)="onCompleted.emit()">
      Continuar
    </button>
  </div>
</div>
