<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
  <h3 class="text-base font-semibold text-secondary mb-4">
    Datos de la reanudación
  </h3>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="form-group">
        <label for="runningStatusName"
          >Estado de reanudación <span class="text-red-500">*</span></label
        >
        <select
          formControlName="runningStatusName"
          class="text-sm rounded border border-gray-200 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary bg-white"
        >
          <option value="">— Seleccionar —</option>
          @for (s of statusOptions(); track s) {
            <option [value]="s.name">{{ s.name }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="resumeDate"
          >Fecha de reanudación <span class="text-red-500">*</span></label
        >
        <input
          id="resumeDate"
          type="date"
          formControlName="resumeDate"
          class="form-control"
        />
      </div>
      <div class="form-group md:col-span-2">
        <label for="observations">Observaciones </label>
        <textarea
          id="observations"
          formControlName="observations"
          class="form-control"
          rows="3"
        ></textarea>
      </div>
    </div>
    <div class="flex justify-end mt-6">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || saving()"
      >
        {{ saving() ? "Guardando..." : "Guardar reanudación" }}
      </button>
    </div>
  </form>
</div>
