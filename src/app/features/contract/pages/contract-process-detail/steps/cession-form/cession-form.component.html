<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
  <h3 class="text-base font-semibold text-secondary mb-4">
    Datos de la cesión
  </h3>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="form-group">
        <label for="previousEmployeeId">ID empleado anterior</label>
        <input
          id="previousEmployeeId"
          type="number"
          formControlName="previousEmployeeId"
          class="form-control"
          min="1"
        />
      </div>
      <div class="form-group">
        <label for="newEmployeeId">ID nuevo empleado</label>
        <input
          id="newEmployeeId"
          type="number"
          formControlName="newEmployeeId"
          class="form-control"
          min="1"
        />
      </div>
      <div class="form-group">
        <label for="previousAgencyId">ID agencia anterior</label>
        <input
          id="previousAgencyId"
          type="number"
          formControlName="previousAgencyId"
          class="form-control"
          min="1"
        />
      </div>
      <div class="form-group">
        <label for="newAgencyId">ID nueva agencia</label>
        <input
          id="newAgencyId"
          type="number"
          formControlName="newAgencyId"
          class="form-control"
          min="1"
        />
      </div>
      <div class="form-group">
        <label for="executedAmount"
          >Monto ejecutado <span class="text-red-500">*</span></label
        >
        <input
          id="executedAmount"
          type="number"
          formControlName="executedAmount"
          class="form-control"
          min="0"
          step="0.01"
        />
      </div>
      <div class="form-group">
        <label for="pendingAmount"
          >Monto pendiente <span class="text-red-500">*</span></label
        >
        <input
          id="pendingAmount"
          type="number"
          formControlName="pendingAmount"
          class="form-control"
          min="0"
          step="0.01"
        />
      </div>
      <div class="form-group md:col-span-2">
        <label for="cessionDesc">Descripción</label>
        <textarea
          id="cessionDesc"
          formControlName="description"
          class="form-control"
          rows="3"
        ></textarea>
      </div>
    </div>
    <div class="flex justify-end mt-6">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || saving()"
      >
        {{ saving() ? "Guardando..." : "Guardar cesión" }}
      </button>
    </div>
  </form>
</div>
