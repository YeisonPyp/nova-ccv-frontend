<div class="p-6 space-y-8">
  <div>
    <h1 class="text-2xl font-bold text-secondary">Contratos importados</h1>
    <p class="text-tertiary text-sm">
      Contratos sembrados desde PDF y siembras recientes
    </p>
  </div>

  <section class="space-y-3">
    <h2 class="text-lg font-semibold text-secondary">Contratos sembrados</h2>
    <app-pagination-table
      #seededContractsTable
      [service]="seededContractService"
      [tableColumns]="seededContractsColumns"
      emptyMessage="No hay contratos sembrados."
    ></app-pagination-table>
  </section>

  <section class="space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-semibold text-secondary">Siembras recientes</h2>
      <div class="flex items-center gap-2">
        @if (uploadError()) {
          <span class="text-xs text-red-600">{{ uploadError() }}</span>
        }
        <label
          class="px-4 py-2 bg-primary text-white text-sm font-bold rounded-lg shadow-sm cursor-pointer hover:bg-primary transition-all"
          [class.opacity-60]="uploading()"
        >
          {{ uploading() ? "Procesando..." : "Subir PDF" }}
          <input
            type="file"
            accept="application/pdf"
            class="hidden"
            [disabled]="uploading()"
            (change)="onFileSelected($event)"
          />
        </label>
      </div>
    </div>

    <app-pagination-table
      #contractSeedingsTable
      [service]="contractSeedingService"
      [tableColumns]="contractSeedingsColumns"
      emptyMessage="No hay siembras recientes."
    ></app-pagination-table>
  </section>
</div>
