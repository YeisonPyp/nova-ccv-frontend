<div app-loading-spinner [isLoading]="loading()"></div>

@if (!loading()) {
  <div class="flex flex-col gap-3">
    <div class="flex justify-end">
      <button
        type="button"
        class="btn btn-primary disabled:opacity-40 disabled:cursor-not-allowed"
        [disabled]="monthLimitReached()"
        [title]="
          monthLimitReached()
            ? 'Ya se planearon todos los meses de duración del proceso contractual'
            : ''
        "
        (click)="openCreate()"
      >
        + Nueva ejecución
      </button>
    </div>

    <app-dynamic-table [data]="rows()" [columns]="columns" [exportable]="false">
      <ng-template #customCell let-row let-col="column">
        @switch (col.key) {
          @case ("amount") {
            <span class="block text-right">
              {{
                row.execution.amount
                  | currency: "COP" : "symbol-narrow" : "1.0-0"
              }}
            </span>
          }
          @case ("status") {
            <select
              class="form-control text-xs"
              [ngModel]="row.execution.status"
              (ngModelChange)="changeStatus(row, $event)"
            >
              @for (opt of statusOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          }
          @default {
            {{ row.label }}
          }
        }
      </ng-template>

      <ng-template #actions let-row>
        <div class="flex gap-6">
          <button
            type="button"
            class="text-gray-500 hover:text-primary"
            title="Editar"
            (click)="openEdit(row)"
          >
            <app-edit-icon />
          </button>
          <button
            type="button"
            class="text-gray-500 hover:text-red-600"
            title="Eliminar"
            (click)="deleteExecution(row)"
          >
            <app-trash-icon />
          </button>
          @if (row.execution.contract; as contract) {
            <a
              [routerLink]="['/contracts', contract.id]"
              class="text-primary hover:underline"
            >
              {{ contract.contractId }}
            </a>
          } @else {
            <button
              type="button"
              class="text-xs font-medium text-primary hover:underline whitespace-nowrap"
              (click)="createContract(row)"
            >
              Crear contrato
            </button>
          }
        </div>
      </ng-template>
    </app-dynamic-table>
  </div>
}

@if (modalOpen()) {
  <app-execution-upsert-modal
    [plan]="plan()"
    [execution]="editingExecution()"
    [usedMonths]="usedMonths()"
    [existingExecutions]="executions()"
    (closed)="closeModal()"
    (saved)="onSaved($event)"
  />
}
