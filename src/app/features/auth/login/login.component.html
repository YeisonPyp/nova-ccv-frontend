<div
  class="min-h-screen flex items-center justify-center p-4 bg-primary relative overflow-hidden md:p-8"
>
  <div
    class="bg-white rounded-2xl p-8 md:p-10 w-full max-w-md shadow-xl relative z-10 animate-[slideInUp_0.5s_ease]"
  >
    <!-- Logo y Título -->
    <div class="text-center mb-8">
      <img src="/logo.png" alt="Logo" class="w-16 h-16 mx-auto mb-4" />
      <h1 class="text-2xl font-bold text-secondary mb-2">
        Camara de Comercio Villavicencio
      </h1>
      <p class="text-tertiary text-sm">Sistema de Gestión Empresarial</p>
    </div>

    <!-- Formulario -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-6"
    >
      <!-- Campo Usuario -->
      <div class="flex flex-col">
        <label
          for="username"
          class="flex items-center gap-2 mb-2 text-secondary font-semibold text-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-5 h-5 text-primary"
          >
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
            />
          </svg>
          Usuario
        </label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-secondary bg-white transition-all focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/10 placeholder-gray-400"
          [ngClass]="{
            'border-red-500 focus:ring-red-500/10': isFieldInvalid('username'),
          }"
          placeholder="Ingresa tu usuario"
          autocomplete="username"
        />
        @if (isFieldInvalid("username")) {
          <span
            class="flex items-center gap-1.5 text-red-500 text-xs mt-1.5 font-medium"
          >
            {{ getFieldError("username") }}
          </span>
        }
      </div>

      <!-- Campo Contraseña -->
      <div class="flex flex-col">
        <label
          for="password"
          class="flex items-center gap-2 mb-2 text-secondary font-semibold text-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-5 h-5 text-primary"
          >
            <path
              d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
            />
          </svg>
          Contraseña
        </label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            class="w-full px-4 py-3 pr-12 border-2 border-gray-200 rounded-xl text-secondary bg-white transition-all focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/10 placeholder-gray-400"
            [ngClass]="{
              'border-red-500 focus:ring-red-500/10':
                isFieldInvalid('password'),
            }"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-tertiary hover:text-primary transition-colors flex items-center justify-center focus:outline-none"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="
              showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'
            "
          >
            @if (showPassword()) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="w-5 h-5"
              >
                <path
                  d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
                />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="w-5 h-5"
              >
                <path
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                />
              </svg>
            }
          </button>
        </div>
        @if (isFieldInvalid("password")) {
          <span
            class="flex items-center gap-1.5 text-red-500 text-xs mt-1.5 font-medium"
          >
            {{ getFieldError("password") }}
          </span>
        }
      </div>

      <!-- Recordar sesión (opcional) -->
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-sm mb-2"
      >
        <label class="flex items-center gap-2 cursor-pointer text-tertiary">
          <input
            type="checkbox"
            class="w-4 h-4 cursor-pointer accent-primary"
          />
          <span>Recordar sesión</span>
        </label>
        <a
          routerLink="/auth/forgot-password"
          class="text-primary font-medium hover:text-primary/80 hover:underline transition-colors"
          >¿Olvidaste tu contraseña?</a
        >
      </div>

      <!-- Mensaje de Error Global -->
      @if (errorMessage()) {
        <div
          class="flex items-start gap-3 p-4 rounded-xl mb-2 text-sm bg-red-50 text-red-700 border border-red-200 animate-[slideInDown_0.3s_ease]"
          role="alert"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-5 h-5 shrink-0 mt-0.5 text-red-500"
          >
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
            />
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Botón de Login -->
      <button
        type="submit"
        class="w-full py-3.5 px-6 bg-primary text-white border-none rounded-xl text-base font-semibold cursor-pointer transition-all flex items-center justify-center gap-2 shadow-sm hover:not-disabled:-translate-y-0.5 hover:not-disabled:shadow-md hover:not-disabled:shadow-primary/30 active:not-disabled:translate-y-0 disabled:opacity-70 disabled:cursor-not-allowed"
        [disabled]="isLoading() || loginForm.invalid"
      >
        @if (isLoading()) {
          <span
            class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"
          ></span>
          Iniciando sesión...
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"
            />
          </svg>
          Iniciar Sesión
        }
      </button>
    </form>
  </div>
</div>
